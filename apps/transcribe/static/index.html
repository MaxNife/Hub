<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transcribe</title>
<script>
  (function () {
    function apply() {
      try {
        var t = localStorage.getItem('hub:theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        else document.documentElement.removeAttribute('data-theme');
      } catch (e) {}
    }
    apply();
    window.addEventListener('storage', function (e) { if (e.key === 'hub:theme') apply(); });
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&display=swap">
<style>
  :root {
    color-scheme: light;
    --paper: #eee9df; --surface: #f8f5ef; --ink: #1c1a16; --muted: #625b4f; --line: #d9d1c2; --dash: #b8ae9c;
    --live: #1e7a48; --focus: #3552e0; --bad: #c0322f;
    --display: 'Bricolage Grotesque', system-ui, sans-serif;
    --body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; --paper: #17150f; --surface: #221f18; --ink: #f2ede3; --muted: #a69e8f; --line: #35302a; --dash: #5a5345; --live: #4cc784; --focus: #8fa2ff; --bad: #f0706b; }
  }
  :root[data-theme="dark"] { color-scheme: dark; --paper: #17150f; --surface: #221f18; --ink: #f2ede3; --muted: #a69e8f; --line: #35302a; --dash: #5a5345; --live: #4cc784; --focus: #8fa2ff; --bad: #f0706b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  button, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 32px 48px; }
  h1 { margin: 0; font-family: var(--display); font-size: 48px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; }
  .lead { margin: 10px 0 0; color: var(--muted); font-size: 16px; }
  .notice { margin-top: 20px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); font-size: 15px; }
  .notice code { font-size: 13px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
  .drop {
    display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 28px; padding: 36px 20px;
    border: 1.5px dashed var(--dash); border-radius: 18px; text-align: center; transition: border-color .15s, background-color .15s;
  }
  .drop.over { border-color: var(--ink); background: var(--surface); }
  .drop b { font-family: var(--display); font-size: 22px; font-weight: 650; letter-spacing: -0.02em; }
  .drop p { margin: 0; color: var(--muted); font-size: 14px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
  .ink { height: 44px; padding: 0 20px; border: none; border-radius: 999px; background: var(--ink); color: var(--paper); font-weight: 600; font-size: 15px; cursor: pointer; }
  .pill { height: 36px; padding: 0 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-weight: 600; font-size: 14px; cursor: pointer; }
  .pill:hover { border-color: var(--dash); }
  select { height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 15px; }
  h2 { margin: 36px 0 0; font-family: var(--display); font-size: 24px; font-weight: 650; letter-spacing: -0.02em; }
  .job { padding: 16px 0; border-top: 1px solid var(--line); }
  .job:last-child { border-bottom: 1px solid var(--line); }
  .top { display: flex; align-items: center; gap: 12px; }
  .name { flex-grow: 1; min-width: 0; font-weight: 600; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { margin-top: 4px; font-size: 14px; color: var(--muted); }
  .meta.err { color: var(--bad); }
  .x { width: 36px; height: 36px; border: none; border-radius: 999px; background: none; color: var(--muted); cursor: pointer; font-size: 18px; }
  .x:hover { background: var(--surface); color: var(--ink); }
  .bar { width: 100%; max-width: 320px; height: 5px; margin-top: 10px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--ink); border-radius: 999px; transition: width .4s; }
  .bar.busy span { width: 30% !important; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-110%); } to { transform: translateX(340%); } }
  .text { margin-top: 12px; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); font-size: 16px; line-height: 1.6; white-space: pre-wrap; max-height: 360px; overflow: auto; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .empty { margin-top: 16px; color: var(--muted); font-size: 15px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); text-align: center; }
  .stat b { display: block; font-family: var(--display); font-size: 24px; font-weight: 700; letter-spacing: -.02em; }
  .stat small { font-size: 12px; color: var(--muted); }
  .find { width: 100%; height: 44px; margin-bottom: 8px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font: inherit; font-size: 15px; }
  .drop { margin-top: 20px; }
  .privacy { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; padding: 12px 16px; border-radius: 14px; background: color-mix(in srgb, var(--live) 10%, var(--surface)); font-size: 14px; }
  .privacy svg { flex-shrink: 0; width: 20px; height: 20px; color: var(--live); }
  @media (max-width: 640px) { .wrap { padding: 20px 16px 32px; } h1 { font-size: 36px; } }
  @media (prefers-reduced-motion: reduce) { .bar.busy span { animation: none; } }
</style>
<link rel="stylesheet" href="./app-kit.css">
</head>
<body>
<div class="wrap">
  <div id="head"></div>
  <p class="privacy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h10v18H7zM11 18h2"/></svg>
    Recordings are deleted from the Hub machine once they’re transcribed. Your transcripts are kept on this device.</p>
  <div class="stats" id="stats" hidden></div>
  <div class="notice" id="engine" hidden></div>
  <label class="drop" id="drop" for="file">
    <b>Drop audio or video here</b>
    <p>MP3, M4A, WAV, MP4 and more</p>
    <span class="row">
      <span class="ink" style="display:inline-flex;align-items:center" role="button">Choose a file</span>
      <select id="lang" aria-label="Language" onclick="event.preventDefault(); event.stopPropagation();"></select>
    </span>
    <input id="file" type="file" accept="audio/*,video/*" multiple hidden>
  </label>
  <section class="ak-section">
    <div class="ak-section-head"><h2 style="margin:0">Your recordings</h2></div>
    <input class="find" id="find" type="search" placeholder="Search names and transcripts" aria-label="Search recordings" hidden>
    <div id="jobs" aria-live="polite"></div>
  </section>
</div>
<script src="./app-kit.js"></script>
<script>
(function () {
  'use strict';
  // Transcripts live on this device (IndexedDB). The server only holds a
  // recording while it is transcribed and the transcript until we collect
  // it here, then both are deleted there.
  var LANGS = [['auto', 'Detect language'], ['en', 'English'], ['fr', 'French'], ['es', 'Spanish'], ['de', 'German'], ['pt', 'Portuguese'],
    ['yo', 'Yoruba'], ['ig', 'Igbo'], ['ha', 'Hausa'], ['sw', 'Swahili']];
  var FORMATS = { txt: 'Text .txt', srt: 'Subtitles .srt', vtt: 'Web subtitles .vtt' };
  var kit = AppKit.create({
    id: 'transcribe',
    title: 'Transcribe',
    fields: [
      { type: 'heading', label: 'New recordings' },
      { key: 'language', label: 'Language', type: 'select', def: 'auto', choices: LANGS },
      { type: 'heading', label: 'Transcripts' },
      { key: 'format', label: 'Download as', type: 'choice', def: 'txt', choices: [['txt', '.txt'], ['srt', '.srt'], ['vtt', '.vtt']] },
      { key: 'openDone', label: 'Open a transcript when it’s ready', type: 'toggle', def: true },
      { key: 'notify', label: 'Tell me when one finishes', type: 'toggle', def: false, hint: 'A browser notification, if you allow it' },
      { type: 'heading', label: 'On this device' },
      { key: 'keep', label: 'Keep transcripts', type: 'choice', def: '0', choices: [['0', 'Until I delete them'], ['30', '1 month'], ['7', '1 week']],
        hint: 'They’re stored in this browser. The Hub machine keeps nothing once they’re here.' },
      { type: 'action', label: 'All transcripts', button: 'Delete all', danger: true, run: function (k, close) {
        if (!window.confirm('Delete every transcript from this device?')) return;
        DB.clear().then(loadLocal); close();
      } },
    ],
    onChange: function (key, value) {
      if (key === 'language') lang.value = value;
      if (key === 'notify' && value && window.Notification && Notification.permission === 'default') Notification.requestPermission();
      if (key === 'keep') loadLocal();
      render();
    },
  });
  document.getElementById('head').replaceWith(kit.header({ tagline: 'Turn recordings into text, on this computer, while you use other apps.' }));
  var jobsEl = document.getElementById('jobs');
  var drop = document.getElementById('drop');
  var fileInput = document.getElementById('file');
  var lang = document.getElementById('lang');
  var find = document.getElementById('find');
  LANGS.forEach(function (l) { var o = document.createElement('option'); o.value = l[0]; o.textContent = l[1]; lang.appendChild(o); });
  lang.value = kit.settings.language;
  var open = {};        // transcript ids expanded
  var uploads = {};     // temporary rows while a file uploads
  var server = [];      // jobs still on the server: queued, running, failed
  var local = [];       // transcripts on this device, newest first
  var collecting = {};  // ids being brought over
  var watched = {};     // jobs this page saw in progress, so we can say when they finish
  var timer = null;
  var engineMissing = false;
  lang.addEventListener('mousedown', function (e) { e.stopPropagation(); });
  lang.addEventListener('click', function (e) { e.stopPropagation(); });
  lang.addEventListener('change', function () { kit.set('language', lang.value); });
  find.addEventListener('input', function () { render(); });

  // ─── IndexedDB ────────────────────────────────────────────────────────
  var DB = (function () {
    var dbp = null;
    function open() {
      if (!dbp) dbp = new Promise(function (resolve, reject) {
        var r = indexedDB.open('transcribe', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('transcripts', { keyPath: 'id' }); };
        r.onsuccess = function () { resolve(r.result); };
        r.onerror = function () { reject(r.error); };
      });
      return dbp;
    }
    function tx(mode, fn) {
      return open().then(function (db) {
        return new Promise(function (resolve, reject) {
          var t = db.transaction('transcripts', mode), req = fn(t.objectStore('transcripts'));
          t.oncomplete = function () { resolve(req ? req.result : undefined); };
          t.onerror = t.onabort = function () { reject(t.error); };
        });
      });
    }
    return {
      all: function () { return tx('readonly', function (s) { return s.getAll(); }); },
      put: function (v) { return tx('readwrite', function (s) { return s.put(v); }); },
      del: function (id) { return tx('readwrite', function (s) { return s.delete(id); }); },
      clear: function () { return tx('readwrite', function (s) { return s.clear(); }); },
    };
  })();
  function loadLocal() {
    return DB.all().then(function (all) {
      var days = +kit.settings.keep;
      local = all.filter(function (t) {
        var old = days && Date.now() - t.saved > days * 864e5;
        if (old) DB.del(t.id);
        return !old;
      }).sort(function (a, b) { return b.saved - a.saved; });
      render();
    }).catch(function () { local = []; render(); });
  }
  // Bring a finished transcript to this device, then delete it from the server.
  function collect(j) {
    if (collecting[j.id]) return;
    collecting[j.id] = true;
    fetch('./api/jobs/' + j.id).then(function (r) { if (!r.ok) throw new Error(); return r.json(); }).then(function (full) {
      var t = { id: full.id, name: full.name, size: full.size, language: full.language, detected: full.detected,
        duration: full.duration, segments: full.segments || [], text: full.text || '', created: full.created_at * 1000, saved: Date.now() };
      return DB.put(t).then(function () { return fetch('./api/jobs/' + j.id, { method: 'DELETE' }); }).then(function () {
        if (watched[j.id]) {
          if (kit.settings.openDone) open[j.id] = true;
          if (kit.settings.notify && window.Notification && Notification.permission === 'granted') new Notification('Transcript ready', { body: j.name });
          else kit.toast(j.name + ' is ready');
        }
        return loadLocal();
      });
    }).catch(function () { /* try again next time */ }).then(function () { delete collecting[j.id]; });
  }

  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function size(n) { return n > 1e9 ? (n / 1e9).toFixed(1) + ' GB' : n > 1e6 ? (n / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1e3)) + ' KB'; }
  function mins(s) { var m = Math.floor(s / 60), r = Math.round(s % 60); return m ? m + ' min ' + (r ? r + ' s' : '') : r + ' s'; }

  function upload(file) {
    var key = 'u' + Date.now() + Math.random();
    uploads[key] = { name: file.name, size: file.size, sent: 0 };
    render();
    var xhr = new XMLHttpRequest();
    xhr.open('POST', './api/jobs?name=' + encodeURIComponent(file.name) + '&language=' + lang.value);
    xhr.upload.onprogress = function (e) { if (e.lengthComputable) { uploads[key].sent = e.loaded / e.total; render(); } };
    xhr.onload = function () {
      delete uploads[key];
      if (xhr.status !== 201) {
        var msg = 'Upload failed';
        try { msg = JSON.parse(xhr.responseText).error || msg; } catch (e) {}
        kit.toast(msg);
      } else {
        try { watched[JSON.parse(xhr.responseText).id] = true; } catch (e) {}
      }
      refresh();
    };
    xhr.onerror = function () { delete uploads[key]; kit.toast('Upload failed. Is Transcribe still running?'); render(); };
    xhr.send(file);
  }

  function pick(files) { Array.prototype.forEach.call(files, upload); fileInput.value = ''; }
  fileInput.addEventListener('change', function () { pick(fileInput.files); });
  ['dragenter', 'dragover'].forEach(function (t) { drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
  ['dragleave', 'drop'].forEach(function (t) { drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
  drop.addEventListener('drop', function (e) { if (e.dataTransfer.files.length) pick(e.dataTransfer.files); });

  function status(j) {
    if (j.status === 'queued') {
      if (engineMissing) return 'Waiting for the speech engine';
      return j.queuePosition ? 'Waiting · ' + j.queuePosition + ' ahead' : 'Starting…';
    }
    if (j.status === 'running') {
      if (!j.duration) return 'Loading the speech model…';
      var pct = Math.round(j.progress * 100);
      var el = (Date.now() / 1000) - j.started_at;
      var eta = j.progress > 0.03 ? el / j.progress - el : null;
      return pct + '% of ' + mins(j.duration) + (eta ? ' · about ' + mins(Math.max(1, eta)) + ' left' : '');
    }
    if (j.status === 'done') return 'Bringing it to this device…';
    return j.error || 'Failed';
  }

  // Downloads are made here from the saved transcript; nothing is fetched.
  function stamp(t, sep) {
    var ms = Math.round(t * 1000), h = Math.floor(ms / 3600000), m = Math.floor(ms / 60000) % 60, s = Math.floor(ms / 1000) % 60;
    var p = function (n, w) { return String(n).padStart(w || 2, '0'); };
    return p(h) + ':' + p(m) + ':' + p(s) + sep + p(ms % 1000, 3);
  }
  function asFormat(t, f) {
    if (f === 'srt') return t.segments.map(function (s, i) { return (i + 1) + '\n' + stamp(s.start, ',') + ' --> ' + stamp(s.end, ',') + '\n' + s.text + '\n'; }).join('\n');
    if (f === 'vtt') return 'WEBVTT\n\n' + t.segments.map(function (s) { return stamp(s.start, '.') + ' --> ' + stamp(s.end, '.') + '\n' + s.text + '\n'; }).join('\n');
    return t.text + '\n';
  }
  function save(t, f) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([asFormat(t, f)], { type: 'text/plain;charset=utf-8' }));
    a.download = (t.name.replace(/\.[^.]+$/, '') || 'transcript') + '.' + f;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 30000);
  }
  function downloads() {
    var first = kit.settings.format;
    return [first].concat(Object.keys(FORMATS).filter(function (f) { return f !== first; })).map(function (f, i) {
      return '<button class="pill" data-act="dl" data-f="' + f + '"' + (i === 0 ? ' style="background:var(--ink);color:var(--paper);border-color:var(--ink)"' : '') + '>' +
        (i === 0 ? 'Download ' : '') + FORMATS[f] + '</button>';
    }).join('');
  }
  function stats() {
    var secs = local.reduce(function (a, t) { return a + (t.duration || 0); }, 0);
    var busy = server.filter(function (j) { return j.status === 'queued' || j.status === 'running'; }).length;
    var box = document.getElementById('stats');
    box.hidden = !local.length && !busy;
    var hours = secs >= 3600 ? (secs / 3600).toFixed(1) + ' hr' : Math.round(secs / 60) + ' min';
    box.innerHTML = '<div class="stat"><b>' + local.length + '</b><small>Transcripts</small></div>' +
      '<div class="stat"><b>' + hours + '</b><small>Of audio</small></div>' +
      '<div class="stat"><b>' + busy + '</b><small>In progress</small></div>';
  }
  function render() {
    stats();
    find.hidden = local.length < 4;
    var q = find.value.trim().toLowerCase();
    var html = '';
    Object.keys(uploads).forEach(function (k) {
      var u = uploads[k];
      html += '<div class="job"><div class="top"><span class="name">' + esc(u.name) + '</span></div>' +
        '<div class="meta">Uploading ' + Math.round(u.sent * 100) + '% of ' + size(u.size) + '</div>' +
        '<div class="bar"><span style="width:' + (u.sent * 100) + '%"></span></div></div>';
    });
    server.forEach(function (j) {
      var running = j.status === 'running' || j.status === 'queued';
      html += '<div class="job" data-id="' + j.id + '" data-where="server"><div class="top"><span class="name">' + esc(j.name) + '</span>' +
        '<button class="x" data-act="cancel" aria-label="' + (running ? 'Cancel ' : 'Dismiss ') + esc(j.name) + '">×</button></div>' +
        '<div class="meta' + (j.status === 'error' ? ' err' : '') + '">' + esc(status(j)) + ' · ' + size(j.size) + '</div>' +
        (running ? '<div class="bar' + (j.status === 'queued' || !j.duration ? ' busy' : '') + '"><span style="width:' + (j.progress * 100) + '%"></span></div>' : '') +
        '</div>';
    });
    var shown = q ? local.filter(function (t) { return t.name.toLowerCase().indexOf(q) >= 0 || t.text.toLowerCase().indexOf(q) >= 0; }) : local;
    shown.forEach(function (t) {
      html += '<div class="job" data-id="' + t.id + '"><div class="top"><span class="name">' + esc(t.name) + '</span>' +
        '<button class="pill" data-act="toggle">' + (open[t.id] ? 'Hide' : 'Read') + '</button>' +
        '<button class="x" data-act="delete" aria-label="Delete ' + esc(t.name) + '">×</button></div>' +
        '<div class="meta">' + [t.duration ? mins(t.duration) : null, t.detected ? t.detected.toUpperCase() : null, kit.ago(t.saved)].filter(Boolean).join(' · ') + '</div>' +
        (open[t.id] ? '<div class="text">' + esc(t.text || '(No speech found)') + '</div>' +
          '<div class="actions"><button class="pill" data-act="copy">Copy text</button>' + downloads() + '</div>' : '') +
        '</div>';
    });
    jobsEl.innerHTML = html || (q ? '<p class="empty">Nothing matches “' + esc(q) + '”.</p>' : '<p class="ak-empty">Nothing yet. Drop a recording above to start.</p>');
  }

  jobsEl.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var id = b.closest('.job').dataset.id;
    var t = local.filter(function (x) { return x.id === id; })[0];
    var act = b.dataset.act;
    if (act === 'toggle') { open[id] = !open[id]; render(); }
    else if (act === 'copy') {
      navigator.clipboard.writeText(t.text || '').then(function () { b.textContent = 'Copied'; setTimeout(function () { b.textContent = 'Copy text'; }, 1500); });
    } else if (act === 'dl') save(t, b.dataset.f);
    else if (act === 'delete') {
      if (!window.confirm('Delete “' + t.name + '” from this device?')) return;
      DB.del(id).then(loadLocal);
    } else if (act === 'cancel') {
      fetch('./api/jobs/' + id, { method: 'DELETE' }).then(refresh);
    }
  });

  function refresh() {
    clearTimeout(timer);
    fetch('./api/jobs').then(function (r) { return r.json(); }).then(function (list) {
      list.forEach(function (j) {
        if (j.status === 'queued' || j.status === 'running') watched[j.id] = true;
        if (j.status === 'done') collect(j);
      });
      server = list.filter(function (j) { return j.status !== 'done' || collecting[j.id]; });
      render();
      var busy = list.some(function (j) { return j.status === 'queued' || j.status === 'running'; });
      timer = setTimeout(refresh, busy || Object.keys(uploads).length ? 1500 : 10000);
    }).catch(function () { timer = setTimeout(refresh, 5000); });
  }

  fetch('./health').then(function (r) { return r.json(); }).then(function (h) {
    if (h.engine === 'missing') {
      engineMissing = true;
      render();
      var n = document.getElementById('engine');
      n.hidden = false;
      n.innerHTML = 'The speech engine isn’t installed yet. On the Hub machine run <code>pip install -r apps/transcribe/requirements.txt</code>, then restart Transcribe. Uploads will wait in the queue.';
    }
  }).catch(function () {});
  loadLocal().then(refresh);
})();
</script>
</body>
</html>
