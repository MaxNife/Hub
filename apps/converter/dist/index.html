<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Converter</title>
<script>
  // Follow Hub's theme choice (same origin, so its setting is readable).
  (function () {
    function apply() {
      try {
        var t = localStorage.getItem('hub:theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        else document.documentElement.removeAttribute('data-theme');
      } catch (e) {}
    }
    apply();
    window.addEventListener('storage', function (e) { if (e.key === 'hub:theme') apply(); });
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&display=swap">
<style>
  :root {
    color-scheme: light;
    --paper: #eee9df; --surface: #f8f5ef; --ink: #1c1a16; --muted: #625b4f; --line: #d9d1c2; --dash: #b8ae9c;
    --live: #1e7a48; --live-ink: #fff; --focus: #3552e0; --bad: #c0322f;
    --display: 'Bricolage Grotesque', system-ui, sans-serif;
    --body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; --paper: #17150f; --surface: #221f18; --ink: #f2ede3; --muted: #a69e8f; --line: #35302a; --dash: #5a5345; --live: #4cc784; --live-ink: #10140f; --focus: #8fa2ff; --bad: #f0706b; }
  }
  :root[data-theme="dark"] { color-scheme: dark; --paper: #17150f; --surface: #221f18; --ink: #f2ede3; --muted: #a69e8f; --line: #35302a; --dash: #5a5345; --live: #4cc784; --live-ink: #10140f; --focus: #8fa2ff; --bad: #f0706b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  h1 { margin: 0; font-family: var(--display); font-size: 40px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; }
  .sub { margin: 8px 0 24px; color: var(--muted); font-size: 15px; }
  .ink-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 22px; border: none; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: 15px; font-weight: 600; cursor: pointer; }
  .pill-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 14px; font-weight: 600; cursor: pointer; }
  .pill-btn:hover { border-color: var(--dash); }
  .seg { display: inline-flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); max-width: 100%; overflow-x: auto; }
  .seg button { height: 34px; padding: 0 14px; border: none; border-radius: 999px; background: transparent; color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .seg button.active, .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
<style>
  body { padding: 32px 16px; }
  .wrap { max-width: 560px; margin: 0 auto; }
  .tabs { display: inline-flex; gap: 4px; padding: 4px; margin-bottom: 20px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); max-width: 100%; overflow-x: auto; }
  .tabs button { height: 34px; padding: 0 14px; border: none; border-radius: 999px; background: transparent; color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .tabs button.active { background: var(--ink); color: var(--paper); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 14px 0 6px; }
  label:first-child { margin-top: 0; }
  input, select { width: 100%; height: 48px; font-size: 16px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); }
  .row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: end; }
  .swap { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; width: 48px; height: 48px; font-size: 18px; cursor: pointer; }
  .swap:hover { border-color: var(--dash); }
  .result { margin-top: 18px; background: var(--ink); color: var(--paper); border-radius: 14px; padding: 16px 18px; font-family: var(--display); font-size: 28px; font-weight: 650; letter-spacing: -0.02em; overflow-wrap: anywhere; }
  .result small { display: block; margin-top: 4px; font-family: var(--body); font-size: 13px; font-weight: 400; letter-spacing: 0; opacity: .7; }
  .note { margin-top: 12px; font-size: 13px; color: var(--muted); }
  .mini { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Converter</h1>
  <p class="sub">Units and currencies, right inside Hub.</p>
  <div class="tabs" id="tabs"></div>
  <div class="card">
    <label for="value">Value</label>
    <input id="value" type="number" value="1" step="any">
    <div class="row">
      <div><label for="from">From</label><select id="from"></select></div>
      <button class="swap" id="swap" title="Swap" type="button">⇄</button>
      <div><label for="to">To</label><select id="to"></select></div>
    </div>
    <div class="result"><span id="out">–</span><small id="formula"></small></div>
    <p class="note" id="note"></p>
  </div>
</div>
<script>
// All relative — works under /apps/converter/ and inside an iframe.
(function () {
  'use strict';
  var CATS = {
    length:      { label: 'Length',      base: 'm',  units: { mm: 0.001, cm: 0.01, m: 1, km: 1000, in: 0.0254, ft: 0.3048, yd: 0.9144, mi: 1609.344 } },
    weight:      { label: 'Weight',      base: 'g',  units: { mg: 0.001, g: 1, kg: 1000, t: 1000000, oz: 28.349523125, lb: 453.59237 } },
    volume:      { label: 'Volume',      base: 'ml', units: { ml: 1, l: 1000, 'fl-oz': 29.5735, cup: 236.588, pint: 473.176, gallon: 3785.41 } },
    temperature: { label: 'Temperature', base: 'c',  units: { c: 1, f: 1, k: 1 } },
    currency:    { label: 'Currency',    base: 'USD', units: null } // filled from rates.table
  };
  var CURR = ['USD', 'EUR', 'GBP', 'NGN', 'JPY', 'CAD'];
  // Live currency rates. Primary: open.er-api.com (free, no key, full set).
  // Fallback: frankfurter (ECB feed, no NGN) merged over cache, then cache,
  // then the hardcoded table. Cache keeps conversions working offline.
  var RATES_KEY = 'converter:rates:v1';
  // Tables are base-per-unit (USD per unit), like length (m per ft).
  // API payloads arrive as foreign-per-USD and are inverted in setRates.
  var FALLBACK_PER_USD = { USD: 1, EUR: 0.88, GBP: 0.75, NGN: 1327, JPY: 158.1, CAD: 1.41 };
  function invert(perUSD) {
    var t = {};
    CURR.forEach(function (c) { t[c] = 1 / perUSD[c]; });
    return t;
  }
  var rates = { table: invert(FALLBACK_PER_USD), source: 'offline', via: '', date: '', fetchedAt: 0 };
  function validTable(t) {
    return t && CURR.every(function (c) { return typeof t[c] === 'number' && isFinite(t[c]); });
  }
  try {
    var cached = JSON.parse(localStorage.getItem(RATES_KEY) || 'null');
    if (cached && validTable(cached.table) && cached.date &&
        Date.now() - Date.parse(cached.date) < 24 * 3600 * 1000) {
      rates = { table: cached.table, source: 'cache', via: cached.via || '', date: cached.date, fetchedAt: 0 };
    }
  } catch (e) { /* fresh start */ }
  var refreshing = false;
  function setRates(perUSD, source, via, date) {
    rates = { table: invert(perUSD), source: source, via: via, date: date, fetchedAt: Date.now() };
    try { localStorage.setItem(RATES_KEY, JSON.stringify(rates)); } catch (e) { /* private mode */ }
    if (state.cat === 'currency') convert();
  }
  function refreshRates(force) {
    if (state.cat !== 'currency' || refreshing) return;
    if (!force && rates.source === 'live' && Date.now() - rates.fetchedAt < 3600 * 1000) return;
    refreshing = true;
    fetch('https://open.er-api.com/v6/latest/USD').then(function (r) {
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    }).then(function (j) {
      if (j.result !== 'success' || !validTable(j.rates)) throw new Error('bad payload');
      var t = {};
      CURR.forEach(function (c) { t[c] = j.rates[c]; });
      setRates(t, 'live', 'exchangerate-api', fmtDate(j.time_last_update_utc));
    }).catch(function () {
      fetch('https://api.frankfurter.dev/v1/latest?from=USD&to=EUR,GBP,JPY,CAD').then(function (r) {
        if (!r.ok) throw new Error('http ' + r.status);
        return r.json();
      }).then(function (j) {
        if (!j.rates) throw new Error('bad payload');
        // Frankfurter has no NGN: keep the current NGN rate, take the rest live.
        var perUSD = { USD: 1, NGN: 1 / rates.table.NGN };
        ['EUR', 'GBP', 'JPY', 'CAD'].forEach(function (c) {
          perUSD[c] = (typeof j.rates[c] === 'number') ? j.rates[c] : 1 / rates.table[c];
        });
        setRates(perUSD, 'live', 'ECB feed', fmtDate(j.date));
      }).catch(function () { /* stay on cache/fallback */ });
    }).finally(function () { refreshing = false; });
  }
  function fmtDate(d) {
    if (!d) return 'today';
    var t = Date.parse(d);
    if (isNaN(t)) return String(d);
    return new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function rateNote() {
    if (rates.source === 'live') return 'Live rates · ' + rates.via + ' · ' + rates.date + '.';
    if (rates.source === 'cache') return 'Cached rates · ' + rates.date + ' — refresh for live.';
    return 'Offline — indicative rates.';
  }
  var LS_KEY = 'converter:last';
  var state = { cat: 'length', from: 'm', to: 'ft' };
  try {
    var saved = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (saved && CATS[saved.cat]) state = saved;
  } catch (e) { /* fresh start */ }

  var tabsEl = document.getElementById('tabs');
  var valueEl = document.getElementById('value');
  var fromEl = document.getElementById('from');
  var toEl = document.getElementById('to');
  var outEl = document.getElementById('out');
  var formulaEl = document.getElementById('formula');
  var noteEl = document.getElementById('note');

  Object.keys(CATS).forEach(function (key) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = CATS[key].label;
    b.dataset.cat = key;
    if (key === state.cat) b.classList.add('active');
    b.addEventListener('click', function () { setCat(key); });
    tabsEl.appendChild(b);
  });

  function unitsFor(cat) { return cat === 'currency' ? rates.table : CATS[cat].units; }

  function setCat(key) {
    state.cat = key;
    var units = Object.keys(unitsFor(key));
    if (unitsFor(key)[state.from] === undefined) state.from = units[0];
    if (unitsFor(key)[state.to] === undefined) state.to = units[1] || units[0];
    tabsEl.querySelectorAll('button').forEach(function (b) {
      b.classList.toggle('active', b.dataset.cat === key);
    });
    fillSelects();
    convert();
    refreshRates(false);
  }

  function fillSelects() {
    var units = Object.keys(unitsFor(state.cat));
    [fromEl, toEl].forEach(function (sel) {
      sel.innerHTML = '';
      units.forEach(function (u) {
        var o = document.createElement('option');
        o.value = u; o.textContent = u;
        sel.appendChild(o);
      });
    });
    fromEl.value = state.from;
    toEl.value = state.to;
  }

  function toCelsius(v, from) {
    if (from === 'c') return v;
    if (from === 'f') return (v - 32) * 5 / 9;
    return v - 273.15; // k
  }
  function fromCelsius(v, to) {
    if (to === 'c') return v;
    if (to === 'f') return v * 9 / 5 + 32;
    return v + 273.15; // k
  }

  function convert() {
    var v = parseFloat(valueEl.value);
    if (isNaN(v)) { outEl.textContent = '–'; formulaEl.textContent = ''; return; }
    var r, formula;
    if (state.cat === 'temperature') {
      r = fromCelsius(toCelsius(v, state.from), state.to);
      formula = v + '°' + state.from.toUpperCase() + ' = ' + round(r) + '°' + state.to.toUpperCase();
    } else {
      var u = unitsFor(state.cat);
      r = v * u[state.from] / u[state.to];
      formula = v + ' ' + state.from + ' = ' + round(r) + ' ' + state.to;
    }
    outEl.textContent = String(round(r)) + ' ' + state.to;
    formulaEl.textContent = formula;
    if (state.cat === 'currency') {
      noteEl.innerHTML = '';
      noteEl.appendChild(document.createTextNode(rateNote() + ' '));
      var rb = document.createElement('button');
      rb.type = 'button';
      rb.textContent = '↻ Refresh';
      rb.className = 'mini';
      rb.addEventListener('click', function () { refreshRates(true); });
      noteEl.appendChild(rb);
    } else {
      noteEl.textContent = 'Base unit: ' + CATS[state.cat].base + '.';
    }
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { /* private mode */ }
  }

  function round(n) {
    return Math.abs(n) >= 1e12 || (Math.abs(n) < 1e-9 && n !== 0)
      ? n.toExponential(4)
      : Math.round(n * 1000000) / 1000000;
  }

  valueEl.addEventListener('input', convert);
  fromEl.addEventListener('change', function () { state.from = fromEl.value; convert(); });
  toEl.addEventListener('change', function () { state.to = toEl.value; convert(); });
  document.getElementById('swap').addEventListener('click', function () {
    var t = state.from; state.from = state.to; state.to = t;
    fromEl.value = state.from; toEl.value = state.to; convert();
  });

  fillSelects();
  convert();
  refreshRates(false); // live rates if the saved tab is currency
})();
</script>
</body>
</html>
