<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meal picker</title>
<script>
  // Follow Hub's theme choice (same origin, so its setting is readable).
  (function () {
    function apply() {
      try {
        var t = localStorage.getItem('hub:theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        else document.documentElement.removeAttribute('data-theme');
      } catch (e) {}
    }
    apply();
    window.addEventListener('storage', function (e) { if (e.key === 'hub:theme') apply(); });
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&display=swap">
<style>
  :root {
    color-scheme: light;
    --paper: #eee9df; --surface: #f8f5ef; --ink: #1c1a16; --muted: #625b4f; --line: #d9d1c2; --dash: #b8ae9c;
    --live: #1e7a48; --live-ink: #fff; --focus: #3552e0; --bad: #c0322f;
    --display: 'Bricolage Grotesque', system-ui, sans-serif;
    --body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; --paper: #17150f; --surface: #221f18; --ink: #f2ede3; --muted: #a69e8f; --line: #35302a; --dash: #5a5345; --live: #4cc784; --live-ink: #10140f; --focus: #8fa2ff; --bad: #f0706b; }
  }
  :root[data-theme="dark"] { color-scheme: dark; --paper: #17150f; --surface: #221f18; --ink: #f2ede3; --muted: #a69e8f; --line: #35302a; --dash: #5a5345; --live: #4cc784; --live-ink: #10140f; --focus: #8fa2ff; --bad: #f0706b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  h1 { margin: 0; font-family: var(--display); font-size: 40px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; }
  .sub { margin: 8px 0 24px; color: var(--muted); font-size: 15px; }
  .ink-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 22px; border: none; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: 15px; font-weight: 600; cursor: pointer; }
  .pill-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 14px; font-weight: 600; cursor: pointer; }
  .pill-btn:hover { border-color: var(--dash); }
  .seg { display: inline-flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); max-width: 100%; overflow-x: auto; }
  .seg button { height: 34px; padding: 0 14px; border: none; border-radius: 999px; background: transparent; color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .seg button.active, .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
<style>
  body { padding: 28px 16px 40px; min-height: 100vh; }
  .wrap { max-width: 560px; margin: 0 auto; }
  .pick { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 28px 24px; text-align: center; }
  .pick small { font-size: 14px; font-weight: 600; color: var(--muted); }
  .dish { font-family: var(--display); font-weight: 700; font-size: 36px; line-height: 1.1; letter-spacing: -0.03em; margin: 10px 0 20px; min-height: 80px; display: flex; align-items: center; justify-content: center; }
  .pick .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button.pick-btn { height: 48px; padding: 0 28px; border: none; border-radius: 999px; font-size: 16px; font-weight: 600; background: var(--ink); color: var(--paper); cursor: pointer; }
  button.pick-btn:disabled { opacity: .5; cursor: default; }
  button.ghost { height: 48px; padding: 0 20px; border: 1px solid var(--line); border-radius: 999px; font-size: 15px; font-weight: 600; background: var(--paper); cursor: pointer; }
  .pick .why { margin: 14px 0 0; font-size: 13px; color: var(--muted); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 10px; min-height: 52px; border-top: 1px solid var(--line); font-size: 16px; }
  li:last-child { border-bottom: 1px solid var(--line); }
  li span { flex-grow: 1; }
  li small { color: var(--muted); font-size: 13px; }
  li button { width: 36px; height: 36px; border: none; border-radius: 999px; background: none; font-size: 16px; cursor: pointer; color: var(--muted); }
  li button:hover { background: var(--surface); color: var(--ink); }
  li button[aria-pressed="true"] { color: #e0a100; }
  .add { display: flex; gap: 8px; margin-top: 14px; }
  .add input { flex-grow: 1; min-width: 0; height: 48px; padding: 0 16px; border: 1px dashed var(--dash); border-radius: 999px; background: transparent; }
  .add input:focus { border-style: solid; border-color: var(--ink); outline: none; }
  .add button { height: 48px; padding: 0 20px; border: none; border-radius: 999px; font-weight: 600; background: var(--ink); color: var(--paper); cursor: pointer; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day { padding: 8px 4px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); text-align: center; min-height: 72px; }
  .day b { display: block; font-size: 12px; color: var(--muted); }
  .day span { display: block; margin-top: 4px; font-size: 12px; line-height: 1.25; overflow-wrap: anywhere; }
  .day.today { border-color: var(--ink); }
</style>
<link rel="stylesheet" href="./app-kit.css">
</head>
<body>
<div class="wrap">
  <div id="head"></div>
  <div class="pick">
    <small id="picklabel">Tonight's pick</small>
    <div class="dish" id="dish">–</div>
    <div class="row">
      <button class="pick-btn" id="reroll" type="button">Pick for me</button>
      <button class="ghost" id="eat" type="button" hidden>We're having this</button>
    </div>
    <p class="why" id="why"></p>
  </div>
  <section class="ak-section">
    <div class="ak-section-head"><h2>This week</h2></div>
    <div class="week" id="week"></div>
  </section>
  <section class="ak-section">
    <div class="ak-section-head"><h2>Your meals (<span id="count">0</span>)</h2></div>
    <ul id="list"></ul>
    <div class="add">
      <input id="newmeal" type="text" placeholder="Add a meal…" maxlength="60" aria-label="New meal">
      <button id="add" type="button">Add</button>
    </div>
  </section>
</div>
<script src="./app-kit.js"></script>
<script>
(function () {
  'use strict';
  var MEALS_KEY = 'meal-picker:meals';
  var LAST_KEY = 'meal-picker:last';   // Hub's Home row reads this
  var DEFAULTS = [
    'Jollof rice and chicken',
    'Spaghetti bolognese',
    'Fried rice and turkey',
    'Beans and plantain',
    'Egusi and pounded yam',
    'Chicken salad',
    'Noodles and eggs',
    'Pizza night'
  ];
  var DAY = 864e5;
  var kit = AppKit.create({
    id: 'meal-picker',
    title: 'Meal picker',
    fields: [
      { type: 'heading', label: 'Picking' },
      { key: 'avoid', label: 'Don’t repeat meals from the last', type: 'choice', def: '3', choices: [['0', 'Off'], ['3', '3 days'], ['7', 'Week']] },
      { key: 'favourites', label: 'Pick favourites more often', type: 'toggle', def: true, hint: 'Starred meals come up twice as often' },
      { key: 'meal', label: 'Picking for', type: 'choice', def: 'dinner', choices: [['breakfast', 'Breakfast'], ['lunch', 'Lunch'], ['dinner', 'Dinner']] },
      { key: 'animate', label: 'Shuffle animation', type: 'toggle', def: true },
      { type: 'heading', label: 'Your list' },
      { type: 'action', label: 'Meals', hint: 'Put the starter list back', button: 'Reset list', danger: true, run: function (k, close) {
        if (!window.confirm('Replace your meals with the starter list?')) return;
        meals = DEFAULTS.slice(); stars = []; save(); close(); render();
      } },
      { type: 'action', label: 'What you’ve had', button: 'Clear history', danger: true, run: function (k, close) { k.store.remove('history'); close(); render(); } },
    ],
    onChange: function () { render(); },
  });
  document.getElementById('head').replaceWith(kit.header({ tagline: 'Tonight’s dinner, decided.' }));

  var dish = document.getElementById('dish');
  var list = document.getElementById('list');
  var count = document.getElementById('count');
  var reroll = document.getElementById('reroll');
  var eat = document.getElementById('eat');
  var why = document.getElementById('why');
  var input = document.getElementById('newmeal');
  var meals = load();
  var stars = kit.store.get('stars', []);
  var current = '';
  function load() {
    try {
      var saved = JSON.parse(localStorage.getItem(MEALS_KEY) || 'null');
      if (Array.isArray(saved) && saved.length > 0 && saved.every(function (m) { return typeof m === 'string'; })) {
        return saved;
      }
    } catch (e) {}
    return DEFAULTS.slice();
  }
  function save() {
    try { localStorage.setItem(MEALS_KEY, JSON.stringify(meals)); } catch (e) {}
    kit.store.set('stars', stars);
  }
  function lastPick() {
    try { return localStorage.getItem(LAST_KEY) || ''; } catch (e) { return ''; }
  }
  // What you actually had, newest first: [{ meal, at }].
  function history() { return kit.store.get('history', []).filter(function (h) { return Date.now() - h.at < 60 * DAY; }); }
  function recentMeals() {
    var days = +kit.settings.avoid;
    return history().filter(function (h) { return Date.now() - h.at < days * DAY; }).map(function (h) { return h.meal; });
  }
  function pool() {
    var avoid = recentMeals();
    var fresh = meals.filter(function (m) { return avoid.indexOf(m) < 0; });
    var base = fresh.length ? fresh : meals;
    if (!kit.settings.favourites) return base;
    return base.concat(base.filter(function (m) { return stars.indexOf(m) >= 0; }));
  }
  function label() { return { breakfast: 'This morning’s pick', lunch: 'Today’s lunch', dinner: 'Tonight’s pick' }[kit.settings.meal] || 'Tonight’s pick'; }
  function render() {
    document.getElementById('picklabel').textContent = label();
    if (!current) dish.textContent = lastPick() || '–';
    count.textContent = String(meals.length);
    var had = history();
    var avoided = recentMeals().filter(function (m) { return meals.indexOf(m) >= 0; });
    why.textContent = +kit.settings.avoid && avoided.length && avoided.length < meals.length
      ? 'Skipping ' + avoided.length + ' you’ve had lately.' : '';
    list.innerHTML = '';
    meals.forEach(function (m) {
      var li = document.createElement('li');
      var s = document.createElement('span');
      s.textContent = m;
      var last = had.filter(function (h) { return h.meal === m; })[0];
      var when = document.createElement('small');
      when.textContent = last ? kit.ago(last.at) : '';
      var star = document.createElement('button');
      var on = stars.indexOf(m) >= 0;
      star.type = 'button';
      star.textContent = on ? '★' : '☆';
      star.setAttribute('aria-pressed', String(on));
      star.setAttribute('aria-label', (on ? 'Unstar ' : 'Star ') + m);
      star.addEventListener('click', function () {
        stars = on ? stars.filter(function (x) { return x !== m; }) : stars.concat([m]);
        save(); render();
      });
      var x = document.createElement('button');
      x.type = 'button';
      x.textContent = '×';
      x.setAttribute('aria-label', 'remove ' + m);
      x.addEventListener('click', function () {
        meals = meals.filter(function (k) { return k !== m; });
        if (meals.length === 0) meals = DEFAULTS.slice();
        save();
        render();
      });
      li.append(s, when, star, x);
      list.appendChild(li);
    });
    // The last seven days, today last.
    var week = document.getElementById('week');
    week.innerHTML = '';
    for (var d = 6; d >= 0; d--) {
      var day = new Date(Date.now() - d * DAY);
      var ate = had.filter(function (h) { return new Date(h.at).toDateString() === day.toDateString(); })[0];
      var cell = document.createElement('div');
      cell.className = 'day' + (d === 0 ? ' today' : '');
      var b = document.createElement('b');
      b.textContent = d === 0 ? 'Today' : day.toLocaleDateString('en-GB', { weekday: 'short' });
      var sp = document.createElement('span');
      sp.textContent = ate ? ate.meal : '–';
      cell.append(b, sp);
      week.appendChild(cell);
    }
  }
  function pick() {
    var choices = pool();
    if (choices.length === 0) return;
    var winner = choices[Math.floor(Math.random() * choices.length)];
    function done() {
      current = winner;
      dish.textContent = winner;
      try { localStorage.setItem(LAST_KEY, winner); } catch (e) {}
      reroll.disabled = false;
      reroll.textContent = 'Pick again';
      eat.hidden = false;
      eat.textContent = 'We’re having this';
      eat.disabled = false;
    }
    if (!kit.settings.animate || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return done();
    reroll.disabled = true;
    var ticks = 0;
    var iv = setInterval(function () {
      dish.textContent = meals[Math.floor(Math.random() * meals.length)];
      if (++ticks > 8) { clearInterval(iv); done(); }
    }, 70);
  }
  reroll.addEventListener('click', pick);
  eat.addEventListener('click', function () {
    var had = kit.store.get('history', []).filter(function (h) { return new Date(h.at).toDateString() !== new Date().toDateString(); });
    had.unshift({ meal: current, at: Date.now() });
    kit.store.set('history', had.slice(0, 60));
    eat.textContent = 'Enjoy!';
    eat.disabled = true;
    render();
  });
  function add() {
    var v = input.value.trim().replace(/\s+/g, ' ');
    if (!v) return;
    if (meals.indexOf(v) === -1) meals.push(v);
    input.value = '';
    save();
    render();
    input.focus();
  }
  document.getElementById('add').addEventListener('click', add);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') add(); });
  render();
})();
</script>
</body>
</html>
