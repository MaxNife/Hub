<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meal picker</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Figtree', system-ui, sans-serif; background: #ffe3cf; color: #6e2a0b; min-height: 100vh; padding: 24px 16px 40px; }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 28px; margin: 0; letter-spacing: -0.5px; }
  p.sub { margin: 4px 0 20px; font-size: 14px; opacity: 0.8; }
  .pick { background: #fff3ea; border: 1px solid #e8c9ae; border-radius: 24px; padding: 28px 24px; text-align: center; }
  .pick small { font-size: 14px; font-weight: 600; }
  .dish { font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 34px; line-height: 1.15; letter-spacing: -0.6px; margin: 10px 0 20px; min-height: 80px; display: flex; align-items: center; justify-content: center; }
  button.pick-btn { border: none; border-radius: 999px; padding: 12px 28px; font: inherit; font-size: 16px; font-weight: 600; background: #6e2a0b; color: #fff3ea; cursor: pointer; }
  button.pick-btn:disabled { opacity: 0.6; cursor: default; }
  h2 { font-size: 16px; margin: 24px 0 10px; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  li { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.7); border: 1px solid #e8c9ae; border-radius: 14px; padding: 10px 12px; }
  li span { flex-grow: 1; }
  li button { border: none; background: none; font-size: 16px; cursor: pointer; color: #6e2a0b; opacity: 0.6; }
  li button:hover { opacity: 1; }
  .add { display: flex; gap: 8px; margin-top: 10px; }
  .add input { flex-grow: 1; font: inherit; padding: 10px 12px; border: 1px solid #e8c9ae; border-radius: 12px; background: #fff; color: inherit; }
  .add button { border: none; border-radius: 12px; padding: 0 18px; font: inherit; font-weight: 600; background: #6e2a0b; color: #fff3ea; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Meal picker</h1>
  <p class="sub">Tonight's dinner, decided.</p>
  <div class="pick">
    <small>Tonight's pick</small>
    <div class="dish" id="dish">–</div>
    <button class="pick-btn" id="reroll" type="button">Reroll</button>
  </div>
  <h2>Your meals (<span id="count">0</span>)</h2>
  <ul id="list"></ul>
  <div class="add">
    <input id="newmeal" type="text" placeholder="Add a meal…" maxlength="60">
    <button id="add" type="button">Add</button>
  </div>
</div>
<script>
(function () {
  'use strict';
  var MEALS_KEY = 'meal-picker:meals';
  var LAST_KEY = 'meal-picker:last';
  var DEFAULTS = [
    'Jollof rice and chicken',
    'Spaghetti bolognese',
    'Fried rice and turkey',
    'Beans and plantain',
    'Egusi and pounded yam',
    'Chicken salad',
    'Noodles and eggs',
    'Pizza night'
  ];
  var dish = document.getElementById('dish');
  var list = document.getElementById('list');
  var count = document.getElementById('count');
  var reroll = document.getElementById('reroll');
  var input = document.getElementById('newmeal');
  var meals = load();

  function load() {
    try {
      var saved = JSON.parse(localStorage.getItem(MEALS_KEY) || 'null');
      if (Array.isArray(saved) && saved.length > 0 && saved.every(function (m) { return typeof m === 'string'; })) {
        return saved;
      }
    } catch (e) {}
    return DEFAULTS.slice();
  }
  function save() {
    try { localStorage.setItem(MEALS_KEY, JSON.stringify(meals)); } catch (e) {}
  }
  function lastPick() {
    try { return localStorage.getItem(LAST_KEY) || ''; } catch (e) { return ''; }
  }
  function render(pick) {
    dish.textContent = pick || lastPick() || '–';
    count.textContent = String(meals.length);
    list.innerHTML = '';
    meals.forEach(function (m) {
      var li = document.createElement('li');
      var s = document.createElement('span');
      s.textContent = m;
      var x = document.createElement('button');
      x.type = 'button';
      x.textContent = '×';
      x.setAttribute('aria-label', 'remove ' + m);
      x.addEventListener('click', function () {
        meals = meals.filter(function (k) { return k !== m; });
        if (meals.length === 0) meals = DEFAULTS.slice();
        save();
        render('');
      });
      li.appendChild(s);
      li.appendChild(x);
      list.appendChild(li);
    });
  }
  function pick() {
    if (meals.length === 0) return;
    reroll.disabled = true;
    var ticks = 0;
    var iv = setInterval(function () {
      dish.textContent = meals[Math.floor(Math.random() * meals.length)];
      if (++ticks > 8) {
        clearInterval(iv);
        var winner = meals[Math.floor(Math.random() * meals.length)];
        dish.textContent = winner;
        try { localStorage.setItem(LAST_KEY, winner); } catch (e) {}
        reroll.disabled = false;
      }
    }, 70);
  }
  reroll.addEventListener('click', pick);
  function add() {
    var v = input.value.trim().replace(/\s+/g, ' ');
    if (!v) return;
    if (meals.indexOf(v) === -1) meals.push(v);
    input.value = '';
    save();
    render('');
    input.focus();
  }
  document.getElementById('add').addEventListener('click', add);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') add(); });
  render('');
})();
</script>
</body>
</html>
