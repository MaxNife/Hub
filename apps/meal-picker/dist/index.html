<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meal picker</title>
<script>
  // Follow Hub's theme choice (same origin, so its setting is readable).
  (function () {
    function apply() {
      try {
        var t = localStorage.getItem('hub:theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        else document.documentElement.removeAttribute('data-theme');
      } catch (e) {}
    }
    apply();
    window.addEventListener('storage', function (e) { if (e.key === 'hub:theme') apply(); });
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&display=swap">
<style>
  :root {
    color-scheme: light;
    --paper: #eee9df; --surface: #f8f5ef; --ink: #1c1a16; --muted: #625b4f; --line: #d9d1c2; --dash: #b8ae9c;
    --live: #1e7a48; --live-ink: #fff; --focus: #3552e0; --bad: #c0322f;
    --display: 'Bricolage Grotesque', system-ui, sans-serif;
    --body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; --paper: #17150f; --surface: #221f18; --ink: #f2ede3; --muted: #a69e8f; --line: #35302a; --dash: #5a5345; --live: #4cc784; --live-ink: #10140f; --focus: #8fa2ff; --bad: #f0706b; }
  }
  :root[data-theme="dark"] { color-scheme: dark; --paper: #17150f; --surface: #221f18; --ink: #f2ede3; --muted: #a69e8f; --line: #35302a; --dash: #5a5345; --live: #4cc784; --live-ink: #10140f; --focus: #8fa2ff; --bad: #f0706b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  h1 { margin: 0; font-family: var(--display); font-size: 40px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; }
  .sub { margin: 8px 0 24px; color: var(--muted); font-size: 15px; }
  .ink-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 22px; border: none; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: 15px; font-weight: 600; cursor: pointer; }
  .pill-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 14px; font-weight: 600; cursor: pointer; }
  .pill-btn:hover { border-color: var(--dash); }
  .seg { display: inline-flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); max-width: 100%; overflow-x: auto; }
  .seg button { height: 34px; padding: 0 14px; border: none; border-radius: 999px; background: transparent; color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .seg button.active, .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
<style>
  body { padding: 32px 16px 40px; min-height: 100vh; }
  .wrap { max-width: 560px; margin: 0 auto; }
  .pick { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 28px 24px; text-align: center; }
  .pick small { font-size: 14px; font-weight: 600; color: var(--muted); }
  .dish { font-family: var(--display); font-weight: 700; font-size: 36px; line-height: 1.1; letter-spacing: -0.03em; margin: 10px 0 20px; min-height: 80px; display: flex; align-items: center; justify-content: center; }
  button.pick-btn { height: 48px; padding: 0 28px; border: none; border-radius: 999px; font-size: 16px; font-weight: 600; background: var(--ink); color: var(--paper); cursor: pointer; }
  button.pick-btn:disabled { opacity: .5; cursor: default; }
  h2 { margin: 32px 0 10px; font-family: var(--display); font-size: 22px; font-weight: 650; letter-spacing: -0.02em; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 10px; height: 52px; border-top: 1px solid var(--line); font-size: 16px; }
  li:last-child { border-bottom: 1px solid var(--line); }
  li span { flex-grow: 1; }
  li button { width: 36px; height: 36px; border: none; border-radius: 999px; background: none; font-size: 16px; cursor: pointer; color: var(--muted); }
  li button:hover { background: var(--surface); color: var(--ink); }
  .add { display: flex; gap: 8px; margin-top: 14px; }
  .add input { flex-grow: 1; height: 48px; padding: 0 16px; border: 1px dashed var(--dash); border-radius: 999px; background: transparent; }
  .add input:focus { border-style: solid; border-color: var(--ink); outline: none; }
  .add button { height: 48px; padding: 0 20px; border: none; border-radius: 999px; font-weight: 600; background: var(--ink); color: var(--paper); cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Meal picker</h1>
  <p class="sub">Tonight's dinner, decided.</p>
  <div class="pick">
    <small>Tonight's pick</small>
    <div class="dish" id="dish">–</div>
    <button class="pick-btn" id="reroll" type="button">Reroll</button>
  </div>
  <h2>Your meals (<span id="count">0</span>)</h2>
  <ul id="list"></ul>
  <div class="add">
    <input id="newmeal" type="text" placeholder="Add a meal…" maxlength="60">
    <button id="add" type="button">Add</button>
  </div>
</div>
<script>
(function () {
  'use strict';
  var MEALS_KEY = 'meal-picker:meals';
  var LAST_KEY = 'meal-picker:last';
  var DEFAULTS = [
    'Jollof rice and chicken',
    'Spaghetti bolognese',
    'Fried rice and turkey',
    'Beans and plantain',
    'Egusi and pounded yam',
    'Chicken salad',
    'Noodles and eggs',
    'Pizza night'
  ];
  var dish = document.getElementById('dish');
  var list = document.getElementById('list');
  var count = document.getElementById('count');
  var reroll = document.getElementById('reroll');
  var input = document.getElementById('newmeal');
  var meals = load();

  function load() {
    try {
      var saved = JSON.parse(localStorage.getItem(MEALS_KEY) || 'null');
      if (Array.isArray(saved) && saved.length > 0 && saved.every(function (m) { return typeof m === 'string'; })) {
        return saved;
      }
    } catch (e) {}
    return DEFAULTS.slice();
  }
  function save() {
    try { localStorage.setItem(MEALS_KEY, JSON.stringify(meals)); } catch (e) {}
  }
  function lastPick() {
    try { return localStorage.getItem(LAST_KEY) || ''; } catch (e) { return ''; }
  }
  function render(pick) {
    dish.textContent = pick || lastPick() || '–';
    count.textContent = String(meals.length);
    list.innerHTML = '';
    meals.forEach(function (m) {
      var li = document.createElement('li');
      var s = document.createElement('span');
      s.textContent = m;
      var x = document.createElement('button');
      x.type = 'button';
      x.textContent = '×';
      x.setAttribute('aria-label', 'remove ' + m);
      x.addEventListener('click', function () {
        meals = meals.filter(function (k) { return k !== m; });
        if (meals.length === 0) meals = DEFAULTS.slice();
        save();
        render('');
      });
      li.appendChild(s);
      li.appendChild(x);
      list.appendChild(li);
    });
  }
  function pick() {
    if (meals.length === 0) return;
    reroll.disabled = true;
    var ticks = 0;
    var iv = setInterval(function () {
      dish.textContent = meals[Math.floor(Math.random() * meals.length)];
      if (++ticks > 8) {
        clearInterval(iv);
        var winner = meals[Math.floor(Math.random() * meals.length)];
        dish.textContent = winner;
        try { localStorage.setItem(LAST_KEY, winner); } catch (e) {}
        reroll.disabled = false;
      }
    }, 70);
  }
  reroll.addEventListener('click', pick);
  function add() {
    var v = input.value.trim().replace(/\s+/g, ' ');
    if (!v) return;
    if (meals.indexOf(v) === -1) meals.push(v);
    input.value = '';
    save();
    render('');
    input.focus();
  }
  document.getElementById('add').addEventListener('click', add);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') add(); });
  render('');
})();
</script>
</body>
</html>
