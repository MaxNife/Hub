<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Name generator</title>
<script>
  // Follow Hub's theme choice (same origin, so its setting is readable).
  (function () {
    function apply() {
      try {
        var t = localStorage.getItem('hub:theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        else document.documentElement.removeAttribute('data-theme');
      } catch (e) {}
    }
    apply();
    window.addEventListener('storage', function (e) { if (e.key === 'hub:theme') apply(); });
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&display=swap">
<style>
  :root {
    color-scheme: light;
    --paper: #eee9df; --surface: #f8f5ef; --ink: #1c1a16; --muted: #625b4f; --line: #d9d1c2; --dash: #b8ae9c;
    --live: #1e7a48; --live-ink: #fff; --focus: #3552e0; --bad: #c0322f;
    --display: 'Bricolage Grotesque', system-ui, sans-serif;
    --body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; --paper: #17150f; --surface: #221f18; --ink: #f2ede3; --muted: #a69e8f; --line: #35302a; --dash: #5a5345; --live: #4cc784; --live-ink: #10140f; --focus: #8fa2ff; --bad: #f0706b; }
  }
  :root[data-theme="dark"] { color-scheme: dark; --paper: #17150f; --surface: #221f18; --ink: #f2ede3; --muted: #a69e8f; --line: #35302a; --dash: #5a5345; --live: #4cc784; --live-ink: #10140f; --focus: #8fa2ff; --bad: #f0706b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  h1 { margin: 0; font-family: var(--display); font-size: 40px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; }
  .sub { margin: 8px 0 24px; color: var(--muted); font-size: 15px; }
  .ink-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 22px; border: none; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: 15px; font-weight: 600; cursor: pointer; }
  .pill-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 14px; font-weight: 600; cursor: pointer; }
  .pill-btn:hover { border-color: var(--dash); }
  .seg { display: inline-flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); max-width: 100%; overflow-x: auto; }
  .seg button { height: 34px; padding: 0 14px; border: none; border-radius: 999px; background: transparent; color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .seg button.active, .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
<style>
  body { padding: 28px 16px 40px; }
  .wrap { max-width: 640px; margin: 0 auto; }
  .bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
  ul { list-style: none; margin: 20px 0 0; padding: 0; }
  li { display: flex; align-items: center; gap: 8px; min-height: 60px; border-top: 1px solid var(--line); animation: rise .35s cubic-bezier(.2,.8,.2,1) both; }
  li:last-child { border-bottom: 1px solid var(--line); }
  li .name { flex-grow: 1; font-family: var(--display); font-size: 26px; font-weight: 650; letter-spacing: -0.02em; overflow-wrap: anywhere; }
  li button { width: 40px; height: 40px; border: none; border-radius: 999px; background: none; color: var(--muted); cursor: pointer; font-size: 18px; }
  li button:hover { background: var(--surface); color: var(--ink); }
  li button[aria-pressed="true"] { color: #e0a100; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  #stars { margin-top: 0; }
  .empty { color: var(--muted); font-size: 15px; margin: 8px 0 0; }
  @media (max-width: 640px) { li .name { font-size: 21px; } }
</style>
<link rel="stylesheet" href="./app-kit.css">
</head>
<body>
<div class="wrap">
  <div id="head"></div>
  <div class="bar">
    <div class="seg" role="group" aria-label="Style" id="styles">
      <button type="button" data-style="pair">Two words</button>
      <button type="button" data-style="compound">Compound</button>
      <button type="button" data-style="invented">Invented</button>
      <button type="button" data-style="nature">Nature</button>
    </div>
    <button class="ink-btn" id="more" type="button">New names</button>
  </div>
  <ul id="list" aria-live="polite"></ul>
  <section class="ak-section">
    <div class="ak-section-head"><h2>Starred <span id="starcount"></span></h2><button type="button" id="copyall">Copy all</button></div>
    <ul id="stars"></ul>
  </section>
</div>
<script src="./app-kit.js"></script>
<script>
(function () {
  'use strict';
  var ADJ = ['Quiet', 'Bright', 'Swift', 'Silver', 'Hidden', 'Bold', 'Little', 'Golden', 'Clever', 'Gentle', 'Lucky', 'Brave', 'Sunny', 'Crisp', 'Velvet', 'Rapid', 'Humble', 'Cosmic', 'Paper', 'Honest', 'Lively', 'Steady', 'Tiny', 'Wild', 'Amber', 'Indigo', 'Coral', 'North', 'Open', 'Plain'];
  var NOUN = ['Harbor', 'Lantern', 'Orbit', 'Maple', 'Signal', 'Compass', 'Pebble', 'Beacon', 'Meadow', 'Circuit', 'Anchor', 'Ember', 'Summit', 'Atlas', 'Canvas', 'Falcon', 'Garden', 'Kite', 'Ledger', 'Mosaic', 'Needle', 'Otter', 'Parcel', 'Quarry', 'Rocket', 'Sparrow', 'Thread', 'Vessel', 'Willow', 'Yard'];
  var NATURE = ['Fern', 'Cedar', 'River', 'Moss', 'Dune', 'Tide', 'Birch', 'Heron', 'Aspen', 'Brook', 'Cove', 'Delta', 'Glade', 'Juniper', 'Lark', 'Mist', 'Oak', 'Reef', 'Sage', 'Thistle'];
  var START = ['ka', 'lo', 'mi', 'zu', 've', 'no', 'ri', 'sa', 'to', 'fe', 'ba', 'qui', 'da', 'lu', 'ne', 'xo'];
  var END = ['ra', 'lo', 'vi', 'nex', 'ly', 'do', 'ma', 'sy', 'ta', 'ro', 'va', 'io', 'ka', 'mo'];
  var $ = function (id) { return document.getElementById(id); };
  var pick = function (a) { return a[Math.floor(Math.random() * a.length)]; };
  var kit = AppKit.create({
    id: 'names',
    title: 'Name generator',
    fields: [
      { type: 'heading', label: 'Ideas' },
      { key: 'count', label: 'Names at a time', type: 'choice', def: '8', choices: [['5', '5'], ['8', '8'], ['12', '12']] },
      { key: 'word', label: 'Always include', type: 'text', def: '', placeholder: 'e.g. Hub', hint: 'A word to put in every name' },
      { key: 'where', label: 'Put it', type: 'choice', def: 'before', choices: [['before', 'Before'], ['after', 'After']] },
      { key: 'letter', label: 'Starting letter', type: 'text', def: '', placeholder: 'Any', hint: 'Only names that start with it' },
      { type: 'heading', label: 'Copying' },
      { key: 'copyAs', label: 'Copy as', type: 'choice', def: 'plain', choices: [['plain', 'Quiet Harbor'], ['kebab', 'quiet-harbor'], ['snake', 'quiet_harbor'], ['camel', 'QuietHarbor']] },
      { type: 'heading', label: 'Starred' },
      { type: 'action', label: 'Starred names', button: 'Clear', danger: true, run: function (k, close) { saveStars([]); close(); render(); } },
    ],
    onChange: function (key) { if (key !== 'copyAs') generate(); },
  });
  $('head').replaceWith(kit.header({ tagline: 'Project names on demand. Star the ones you like.' }));

  var style = 'pair', names = [];
  try { style = (localStorage.getItem('names:style') || 'pair').replace(/"/g, ''); } catch (e) {}
  function stars() { try { return JSON.parse(localStorage.getItem('names:favorites') || '[]'); } catch (e) { return []; } }
  function saveStars(s) { try { localStorage.setItem('names:favorites', JSON.stringify(s)); } catch (e) {} }
  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  function base() {
    if (style === 'pair') return pick(ADJ) + ' ' + pick(NOUN);
    if (style === 'compound') { var a = pick(NOUN), b = pick(NOUN.concat(NATURE)); return a === b ? base() : a + b.toLowerCase(); }
    if (style === 'nature') return pick(ADJ) + ' ' + pick(NATURE);
    var w = pick(START) + pick(START.concat([''])) + pick(END);
    return w[0].toUpperCase() + w.slice(1);
  }
  function make() {
    var n = base(), word = (kit.settings.word || '').trim();
    if (word) n = kit.settings.where === 'after' ? n + ' ' + word : word + ' ' + n;
    return n;
  }
  function generate() {
    var seen = {}, want = +kit.settings.count || 8, letter = (kit.settings.letter || '').trim().charAt(0).toLowerCase();
    names = [];
    for (var tries = 0; names.length < want && tries < 4000; tries++) {
      var n = make();
      var first = (kit.settings.word && kit.settings.where !== 'after' ? n.slice(kit.settings.word.trim().length + 1) : n).charAt(0).toLowerCase();
      if (letter && first !== letter) continue;
      if (!seen[n]) { seen[n] = 1; names.push(n); }
    }
    render();
  }
  function copyText(n) {
    var words = n.replace(/([a-z])([A-Z])/g, '$1 $2').split(/\s+/);
    return { plain: n, kebab: words.join('-').toLowerCase(), snake: words.join('_').toLowerCase(),
      camel: words.map(function (w) { return w[0].toUpperCase() + w.slice(1); }).join('') }[kit.settings.copyAs] || n;
  }
  function row(n) {
    var on = stars().indexOf(n) >= 0;
    return '<li><span class="name">' + esc(n) + '</span>' +
      '<button type="button" data-copy="' + esc(n) + '" aria-label="Copy ' + esc(n) + '" title="Copy">⧉</button>' +
      '<button type="button" data-star="' + esc(n) + '" aria-pressed="' + on + '" aria-label="' + (on ? 'Unstar ' : 'Star ') + esc(n) + '">' + (on ? '★' : '☆') + '</button></li>';
  }
  function render() {
    $('list').innerHTML = names.length ? names.map(row).join('') : '<p class="empty">No names start with that letter in this style. Try another style or letter.</p>';
    var s = stars();
    $('starcount').textContent = s.length ? '(' + s.length + ')' : '';
    $('copyall').hidden = !s.length;
    $('stars').innerHTML = s.length ? s.map(row).join('') : '<p class="ak-empty">Star names you like and they’ll wait for you here.</p>';
    document.querySelectorAll('[data-style]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.style === style)); });
  }
  function copy(text, label) {
    navigator.clipboard.writeText(text).then(function () { kit.toast('Copied ' + label); }, function () { kit.toast('Copy blocked by the browser'); });
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.style) { style = b.dataset.style; try { localStorage.setItem('names:style', style); } catch (err) {} generate(); }
    else if (b.dataset.star) {
      var s = stars(), n = b.dataset.star, i = s.indexOf(n);
      if (i >= 0) s.splice(i, 1); else s.unshift(n);
      saveStars(s.slice(0, 50));
      render();
    } else if (b.dataset.copy) {
      var t = copyText(b.dataset.copy);
      copy(t, '“' + t + '”');
    }
  });
  $('copyall').addEventListener('click', function () { copy(stars().map(copyText).join('\n'), stars().length + ' names'); });
  $('more').addEventListener('click', generate);
  generate();
})();
</script>
</body>
</html>
