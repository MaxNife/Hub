<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory</title>
<script>
  // Follow Hub's theme choice (same origin, so its setting is readable).
  (function () {
    function apply() {
      try {
        var t = localStorage.getItem('hub:theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        else document.documentElement.removeAttribute('data-theme');
      } catch (e) {}
    }
    apply();
    window.addEventListener('storage', function (e) { if (e.key === 'hub:theme') apply(); });
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&display=swap">
<style>
  :root {
    color-scheme: light;
    --paper: #eee9df; --surface: #f8f5ef; --ink: #1c1a16; --muted: #625b4f; --line: #d9d1c2; --dash: #b8ae9c;
    --live: #1e7a48; --live-ink: #fff; --focus: #3552e0; --bad: #c0322f;
    --display: 'Bricolage Grotesque', system-ui, sans-serif;
    --body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; --paper: #17150f; --surface: #221f18; --ink: #f2ede3; --muted: #a69e8f; --line: #35302a; --dash: #5a5345; --live: #4cc784; --live-ink: #10140f; --focus: #8fa2ff; --bad: #f0706b; }
  }
  :root[data-theme="dark"] { color-scheme: dark; --paper: #17150f; --surface: #221f18; --ink: #f2ede3; --muted: #a69e8f; --line: #35302a; --dash: #5a5345; --live: #4cc784; --live-ink: #10140f; --focus: #8fa2ff; --bad: #f0706b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  h1 { margin: 0; font-family: var(--display); font-size: 40px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; }
  .sub { margin: 8px 0 24px; color: var(--muted); font-size: 15px; }
  .ink-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 22px; border: none; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: 15px; font-weight: 600; cursor: pointer; }
  .pill-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 14px; font-weight: 600; cursor: pointer; }
  .pill-btn:hover { border-color: var(--dash); }
  .seg { display: inline-flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); max-width: 100%; overflow-x: auto; }
  .seg button { height: 34px; padding: 0 14px; border: none; border-radius: 999px; background: transparent; color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .seg button.active, .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
<link rel="stylesheet" href="./app-kit.css">
<link rel="stylesheet" href="./game-kit.css">
<style>
  html, body { height: 100%; }
  body { height: 100dvh; overflow: hidden; padding: 16px; }
  .wrap { max-width: 520px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; min-height: 0; }
  .top { display: flex; align-items: center; gap: 10px; }
  h1 { flex-grow: 1; font-size: 28px; }
  .level { font-family: var(--body); font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 6px; }
  button.restart { height: 36px; padding: 0 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 13px; font-weight: 600; cursor: pointer; }
  .stats { display: flex; gap: 8px; margin: 12px 0; }
  .stat { flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px 4px; text-align: center; }
  .stat b { display: block; font-size: 17px; }
  .stat small { font-size: 11px; color: var(--muted); }
  .boardwrap { position: relative; flex: 1; min-height: 0; display: flex; }
  .grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(var(--cols, 4), 1fr); grid-template-rows: repeat(var(--rows, 4), 1fr); gap: 8px; }
  .card { min-height: 0; border: none; border-radius: 12px; font-size: clamp(18px, 5.5vmin, 36px); cursor: pointer; color: transparent;
    background: linear-gradient(135deg, #a07fff, #5a32e0); transition: transform 0.15s, background 0.2s; }
  .card:hover:not(:disabled) { transform: scale(1.04); }
  .card.open, .card.done { background: var(--surface); color: initial; box-shadow: inset 0 0 0 1px var(--line); }
  .card.done { background: color-mix(in srgb, var(--live) 18%, var(--surface)); box-shadow: inset 0 0 0 2px var(--live); cursor: default; }
  .card:disabled { cursor: default; }
  .card.miss { animation: shake 0.3s ease; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .win { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; background: color-mix(in srgb, var(--paper) 94%, transparent); border-radius: 18px; padding: 24px; }
  .win h2 { margin: 0; font-family: var(--display); font-size: 36px; letter-spacing: -0.03em; }
  .win p { margin: 0 0 8px; color: var(--muted); }
  .win .actions { display: flex; gap: 10px; }
  button.primary { height: 48px; padding: 0 28px; border: none; border-radius: 999px; font-weight: 600; font-size: 15px; background: var(--ink); color: var(--paper); cursor: pointer; }
  button.secondary { height: 48px; padding: 0 24px; border: 1px solid var(--line); border-radius: 999px; font-weight: 600; font-size: 15px; background: var(--surface); cursor: pointer; }
  .card.done.restored { animation: none; }
  .card.done { animation: matched 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes matched { 40% { transform: scale(1.1); } }
  .win:not([hidden]) { animation: win-fade 0.3s ease both; }
  .win:not([hidden]) > * { animation: win-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  .win:not([hidden]) > :nth-child(2) { animation-delay: 0.08s; }
  .win:not([hidden]) > :nth-child(3) { animation-delay: 0.16s; }
  @keyframes win-fade { from { opacity: 0; } }
  @keyframes win-pop { from { opacity: 0; transform: translateY(10px) scale(0.9); } }
  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 10; }
  .confetti i { position: absolute; top: -12px; width: 8px; height: 12px; border-radius: 2px; animation: fall var(--d) cubic-bezier(0.25, 0.6, 0.4, 1) var(--delay) forwards; }
  @keyframes fall { to { transform: translate(var(--x), 105vh) rotate(var(--r)); opacity: 0.9; } }
  @media (prefers-reduced-motion: reduce) { .confetti { display: none; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top" id="top">
    <h1>Memory<span class="level" id="level"></span></h1>
    <button class="restart" id="restart" type="button">Restart</button>
  </div>
  <div class="stats">
    <div class="stat"><b id="moves">0</b><small>Moves</small></div>
    <div class="stat"><b id="time">0:00</b><small>Time</small></div>
    <div class="stat"><b id="best">–</b><small>Best time</small></div>
  </div>
  <div class="boardwrap">
    <div class="grid" id="grid"></div>
    <div class="win" id="win" hidden>
      <h2>Cleared!</h2>
      <p id="winline"></p>
      <div class="actions">
        <button class="secondary" id="tomenu" type="button">Menu</button>
        <button class="primary" id="again" type="button">Play again</button>
      </div>
    </div>
  </div>
</div>
<script src="./app-kit.js"></script>
<script src="./game-kit.js"></script>
<script>
(function () {
  'use strict';
  var SETS = {
    space: ['🚀', '🌙', '⚡', '🌊', '🔥', '🍀', '🎧', '🍎', '🪐', '⭐', '☄️', '🛸'],
    animals: ['🦊', '🐼', '🐙', '🦉', '🐢', '🦁', '🐸', '🐝', '🦋', '🐳', '🦔', '🐧'],
    food: ['🍕', '🍩', '🌮', '🍣', '🍉', '🥑', '🍔', '🧁', '🍓', '🥐', '🍜', '🍋'],
  };
  // pairs, columns, rows
  var LEVELS = { easy: [6, 4, 3], normal: [8, 4, 4], hard: [12, 4, 6] };
  var LABEL = { easy: 'Easy', normal: 'Normal', hard: 'Hard' };
  // Hub reads memory:best (normal games) and memory:progress for its Home row.
  function bestKey(level) { return level === 'normal' ? 'memory:best' : 'memory:best:' + level; }
  var PROGRESS_KEY = 'memory:progress';
  var WINS_KEY = 'memory:wins';
  var grid = document.getElementById('grid');
  var movesEl = document.getElementById('moves');
  var timeEl = document.getElementById('time');
  var bestEl = document.getElementById('best');
  var levelEl = document.getElementById('level');
  var winBox = document.getElementById('win');
  var winline = document.getElementById('winline');
  var deck = [], level = 'normal', first = null, lock = false, moves = 0, matched = 0, secs = 0, timer = null;

  function num(key) {
    try { var v = parseInt(localStorage.getItem(key) || '', 10); return isFinite(v) ? v : null; } catch (e) { return null; }
  }
  function best(l) { return num(bestKey(l)); }
  function fmt(s) { return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  function paintBest() { var b = best(level); bestEl.textContent = b === null ? '–' : fmt(b); }
  function tick() { secs++; timeEl.textContent = fmt(secs); }
  function stopClock() { if (timer) { clearInterval(timer); timer = null; } }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function save() {
    var done = [];
    grid.querySelectorAll('.card.done').forEach(function (c) { done.push(Number(c.dataset.i)); });
    try {
      localStorage.setItem(PROGRESS_KEY, JSON.stringify({
        deck: deck, done: done, moves: moves, secs: secs, level: level, pairs: done.length / 2, total: deck.length / 2
      }));
    } catch (e) {}
  }
  function clearProgress() { try { localStorage.removeItem(PROGRESS_KEY); } catch (e) {} }
  function saved() {
    try {
      var p = JSON.parse(localStorage.getItem(PROGRESS_KEY) || 'null');
      if (p && Array.isArray(p.deck) && Array.isArray(p.done) && p.deck.length >= 4 && p.deck.length % 2 === 0 &&
          p.done.length > 0 && p.done.length < p.deck.length) return p;
    } catch (e) {}
    return null;
  }
  function build(cards, l) {
    deck = cards;
    level = LEVELS[l] ? l : 'normal';
    var shape = LEVELS[level];
    // A saved deck from an older version may not match its level; fit the grid to the deck.
    var cols = deck.length === shape[0] * 2 ? shape[1] : 4;
    grid.style.setProperty('--cols', cols);
    grid.style.setProperty('--rows', Math.ceil(deck.length / cols));
    grid.innerHTML = '';
    deck.forEach(function (face, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'card';
      b.dataset.face = face;
      b.dataset.i = i;
      b.setAttribute('aria-label', 'card ' + (i + 1));
      b.addEventListener('click', function () { flip(b); });
      grid.appendChild(b);
    });
    first = null; lock = false; moves = 0; matched = 0; secs = 0;
    stopClock();
    movesEl.textContent = '0';
    timeEl.textContent = '0:00';
    levelEl.textContent = LABEL[level];
    winBox.hidden = true;
    paintBest();
  }
  function deal(s) {
    clearProgress();
    var faces = shuffle((SETS[s.faces] || SETS.space).slice()).slice(0, (LEVELS[s.difficulty] || LEVELS.normal)[0]);
    build(shuffle(faces.concat(faces)), s.difficulty);
  }
  // Pick up where the last session left off; the clock resumes on the next flip.
  function resume(p) {
    build(p.deck, p.level || 'normal');
    p.done.forEach(function (i) {
      var c = grid.children[i];
      if (!c) return;
      c.classList.add('open', 'done', 'restored');
      c.textContent = c.dataset.face;
      c.disabled = true;
    });
    matched = p.done.length;
    moves = p.moves || 0;
    secs = p.secs || 0;
    movesEl.textContent = String(moves);
    timeEl.textContent = fmt(secs);
  }
  function flip(card) {
    if (lock || card.classList.contains('open') || card.classList.contains('done')) return;
    if (!timer) timer = setInterval(tick, 1000);
    kit.sfx('flip');
    card.classList.add('open');
    card.textContent = card.dataset.face;
    if (!first) { first = card; return; }
    moves++;
    movesEl.textContent = String(moves);
    if (first.dataset.face === card.dataset.face) {
      first.classList.add('done');
      card.classList.add('done');
      first.disabled = true;
      card.disabled = true;
      first = null;
      matched += 2;
      if (matched === deck.length) finish();
      else { kit.sfx('match'); save(); }
    } else {
      save();
      lock = true;
      var a = first, b = card;
      first = null;
      setTimeout(function () {
        kit.sfx('miss');
        a.classList.add('miss'); b.classList.add('miss');
      }, 380);
      setTimeout(function () {
        a.classList.remove('open', 'miss'); a.textContent = '';
        b.classList.remove('open', 'miss'); b.textContent = '';
        lock = false;
      }, 700);
    }
  }
  function finish() {
    stopClock();
    clearProgress();
    kit.sfx('win');
    kit.played();
    try { localStorage.setItem(WINS_KEY, String((num(WINS_KEY) || 0) + 1)); } catch (e) {}
    var b = best(level);
    var isBest = b === null || secs < b;
    if (isBest) {
      try { localStorage.setItem(bestKey(level), String(secs)); } catch (e) {}
      paintBest();
    }
    winline.textContent = LABEL[level] + ' · ' + fmt(secs) + ' · ' + moves + ' moves' + (isBest ? ' · new best!' : '');
    winBox.hidden = false;
    celebrate(isBest ? 90 : 45);
  }
  // A burst of confetti in Hub's brand colours; more for a new best.
  function celebrate(n) {
    var colors = ['#8b6cff', '#ff9a3d', '#2fc08f', '#ff5c7a', '#ffd34d', '#33b6f0'];
    var box = document.createElement('div');
    box.className = 'confetti';
    for (var i = 0; i < n; i++) {
      var c = document.createElement('i');
      c.style.left = Math.random() * 100 + '%';
      c.style.background = colors[i % colors.length];
      c.style.setProperty('--x', (Math.random() * 160 - 80) + 'px');
      c.style.setProperty('--r', (Math.random() * 900 - 450) + 'deg');
      c.style.setProperty('--d', (1.6 + Math.random() * 1.4) + 's');
      c.style.setProperty('--delay', (Math.random() * 0.35) + 's');
      if (i % 3 === 0) { c.style.width = '6px'; c.style.height = '6px'; c.style.borderRadius = '50%'; }
      box.appendChild(c);
    }
    document.body.appendChild(box);
    setTimeout(function () { box.remove(); }, 3400);
  }

  var kit = GameKit.create({
    id: 'memory',
    title: 'Memory',
    tagline: 'Flip, remember, match the pairs.',
    art: '<svg viewBox="0 0 64 64"><defs><linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A07FFF"/><stop offset="1" stop-color="#5A32E0"/></linearGradient></defs>' +
      '<rect width="64" height="64" rx="16" fill="url(#mg)"/><rect x="15" y="20" width="19" height="27" rx="4" fill="#fff" fill-opacity=".5" transform="rotate(-12 24.5 33.5)"/>' +
      '<rect x="28" y="16" width="19" height="27" rx="4" fill="#fff" transform="rotate(8 37.5 29.5)"/></svg>',
    howTo: [
      'Tap a card to flip it, then flip a second one.',
      'If they match they stay face up; if not, they turn back over.',
      'Clear the board in as few moves and as little time as you can.',
      'Leave whenever you like: your game is saved and Continue picks it up.',
    ],
    difficulties: [
      { id: 'easy', label: 'Easy', detail: '6 pairs' },
      { id: 'normal', label: 'Normal', detail: '8 pairs' },
      { id: 'hard', label: 'Hard', detail: '12 pairs' },
    ],
    defaultDifficulty: 'normal',
    options: [{ key: 'faces', label: 'Card faces', def: 'space', choices: [['space', 'Space'], ['animals', 'Animals'], ['food', 'Food']] }],
    stats: function (k) {
      var b = best(k.settings.difficulty);
      return [
        { label: 'Best · ' + LABEL[k.settings.difficulty], value: b === null ? '–' : fmt(b) },
        { label: 'Boards cleared', value: num(WINS_KEY) || 0 },
      ];
    },
    saved: function () {
      var p = saved();
      return p && { label: (LABEL[p.level] || 'Normal') + ' · ' + p.done.length / 2 + ' of ' + p.deck.length / 2 + ' pairs · ' + fmt(p.secs || 0) };
    },
    onNew: deal,
    onContinue: function (s) { var p = saved(); if (p) resume(p); else deal(s); },
    onPause: function () { stopClock(); if (matched > 0 && matched < deck.length) save(); },
    onResetStats: function () {
      ['easy', 'normal', 'hard'].forEach(function (l) { try { localStorage.removeItem(bestKey(l)); } catch (e) {} });
      try { localStorage.removeItem(WINS_KEY); } catch (e) {}
      paintBest();
    },
  });
  document.getElementById('top').prepend(kit.menuButton());
  document.getElementById('restart').addEventListener('click', function () { kit.sfx('tap'); deal(kit.settings); });
  document.getElementById('again').addEventListener('click', function () { deal(kit.settings); });
  document.getElementById('tomenu').addEventListener('click', function () { kit.showHome(); });
})();
</script>
</body>
</html>
