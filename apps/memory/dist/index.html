<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory</title>
<script>
  // Follow Hub's theme choice (same origin, so its setting is readable).
  (function () {
    function apply() {
      try {
        var t = localStorage.getItem('hub:theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        else document.documentElement.removeAttribute('data-theme');
      } catch (e) {}
    }
    apply();
    window.addEventListener('storage', function (e) { if (e.key === 'hub:theme') apply(); });
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&display=swap">
<style>
  :root {
    color-scheme: light;
    --paper: #eee9df; --surface: #f8f5ef; --ink: #1c1a16; --muted: #625b4f; --line: #d9d1c2; --dash: #b8ae9c;
    --live: #1e7a48; --live-ink: #fff; --focus: #3552e0; --bad: #c0322f;
    --display: 'Bricolage Grotesque', system-ui, sans-serif;
    --body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; --paper: #17150f; --surface: #221f18; --ink: #f2ede3; --muted: #a69e8f; --line: #35302a; --dash: #5a5345; --live: #4cc784; --live-ink: #10140f; --focus: #8fa2ff; --bad: #f0706b; }
  }
  :root[data-theme="dark"] { color-scheme: dark; --paper: #17150f; --surface: #221f18; --ink: #f2ede3; --muted: #a69e8f; --line: #35302a; --dash: #5a5345; --live: #4cc784; --live-ink: #10140f; --focus: #8fa2ff; --bad: #f0706b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  h1 { margin: 0; font-family: var(--display); font-size: 40px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; }
  .sub { margin: 8px 0 24px; color: var(--muted); font-size: 15px; }
  .ink-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 22px; border: none; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: 15px; font-weight: 600; cursor: pointer; }
  .pill-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 14px; font-weight: 600; cursor: pointer; }
  .pill-btn:hover { border-color: var(--dash); }
  .seg { display: inline-flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); max-width: 100%; overflow-x: auto; }
  .seg button { height: 34px; padding: 0 14px; border: none; border-radius: 999px; background: transparent; color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .seg button.active, .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
<style>
  html, body { height: 100%; }
  body { height: 100dvh; overflow: hidden; padding: 16px; }
  .wrap { max-width: 480px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; min-height: 0; }
  .top { display: flex; align-items: center; gap: 10px; }
  h1 { flex-grow: 1; font-size: 32px; }
  button.restart { height: 36px; padding: 0 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 13px; font-weight: 600; cursor: pointer; }
  .stats { display: flex; gap: 8px; margin: 12px 0; }
  .stat { flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px 4px; text-align: center; }
  .stat b { display: block; font-size: 17px; }
  .stat small { font-size: 11px; color: var(--muted); }
  .boardwrap { position: relative; flex: 1; min-height: 0; display: flex; }
  .grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 8px; }
  .card { min-height: 0; border: none; border-radius: 12px; font-size: clamp(20px, 6vmin, 36px); cursor: pointer; color: transparent;
    background: linear-gradient(135deg, #a07fff, #5a32e0); transition: transform 0.15s, background 0.2s; }
  .card:hover:not(:disabled) { transform: scale(1.04); }
  .card.open, .card.done { background: var(--surface); color: initial; box-shadow: inset 0 0 0 1px var(--line); }
  .card.done { background: color-mix(in srgb, var(--live) 18%, var(--surface)); box-shadow: inset 0 0 0 2px var(--live); cursor: default; }
  .card:disabled { cursor: default; }
  .win { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; background: color-mix(in srgb, var(--paper) 94%, transparent); border-radius: 18px; padding: 24px; }
  .win h2 { margin: 0; font-family: var(--display); font-size: 36px; letter-spacing: -0.03em; }
  .win p { margin: 0 0 8px; color: var(--muted); }
  button.primary { height: 48px; padding: 0 28px; border: none; border-radius: 999px; font-weight: 600; font-size: 15px; background: var(--ink); color: var(--paper); cursor: pointer; }
  .card.done.restored { animation: none; }
  .card.done { animation: matched 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes matched { 40% { transform: scale(1.1); } }
  .win:not([hidden]) { animation: win-fade 0.3s ease both; }
  .win:not([hidden]) > * { animation: win-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  .win:not([hidden]) > :nth-child(2) { animation-delay: 0.08s; }
  .win:not([hidden]) > :nth-child(3) { animation-delay: 0.16s; }
  @keyframes win-fade { from { opacity: 0; } }
  @keyframes win-pop { from { opacity: 0; transform: translateY(10px) scale(0.9); } }
  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 10; }
  .confetti i { position: absolute; top: -12px; width: 8px; height: 12px; border-radius: 2px; animation: fall var(--d) cubic-bezier(0.25, 0.6, 0.4, 1) var(--delay) forwards; }
  @keyframes fall { to { transform: translate(var(--x), 105vh) rotate(var(--r)); opacity: 0.9; } }
  @media (prefers-reduced-motion: reduce) { .confetti { display: none; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Memory</h1>
    <button class="restart" id="restart" type="button">Restart</button>
  </div>
  <div class="stats">
    <div class="stat"><b id="moves">0</b><small>Moves</small></div>
    <div class="stat"><b id="time">0:00</b><small>Time</small></div>
    <div class="stat"><b id="best">–</b><small>Best time</small></div>
  </div>
  <div class="boardwrap">
    <div class="grid" id="grid"></div>
    <div class="win" id="win" hidden>
      <h2>Cleared!</h2>
      <p id="winline"></p>
      <button class="primary" id="again" type="button">Play again</button>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';
  var FACES = ['🚀', '🌙', '⚡', '🌊', '🔥', '🍀', '🎧', '🍎'];
  var BEST_KEY = 'memory:best';
  // In-progress game, so Hub can show "6 of 8 pairs" and Resume restores it.
  var PROGRESS_KEY = 'memory:progress';
  var grid = document.getElementById('grid');
  var movesEl = document.getElementById('moves');
  var timeEl = document.getElementById('time');
  var bestEl = document.getElementById('best');
  var winBox = document.getElementById('win');
  var winline = document.getElementById('winline');
  var deck = [], first = null, lock = false, moves = 0, matched = 0, secs = 0, timer = null, started = false;

  function best() {
    try {
      var v = parseInt(localStorage.getItem(BEST_KEY) || '', 10);
      return isFinite(v) ? v : null;
    } catch (e) { return null; }
  }
  function fmt(s) { return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  function paintBest() {
    var b = best();
    bestEl.textContent = b === null ? '–' : fmt(b);
  }
  function tick() {
    secs++;
    timeEl.textContent = fmt(secs);
  }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function save() {
    var done = [];
    grid.querySelectorAll('.card.done').forEach(function (c) { done.push(Number(c.dataset.i)); });
    try {
      localStorage.setItem(PROGRESS_KEY, JSON.stringify({
        deck: deck, done: done, moves: moves, secs: secs, pairs: done.length / 2, total: deck.length / 2
      }));
    } catch (e) {}
  }
  function clearProgress() {
    try { localStorage.removeItem(PROGRESS_KEY); } catch (e) {}
  }
  function saved() {
    try {
      var p = JSON.parse(localStorage.getItem(PROGRESS_KEY) || 'null');
      if (p && Array.isArray(p.deck) && p.deck.length === FACES.length * 2 && Array.isArray(p.done)) return p;
    } catch (e) {}
    return null;
  }
  function build(faces) {
    deck = faces;
    grid.innerHTML = '';
    deck.forEach(function (face, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'card';
      b.dataset.face = face;
      b.dataset.i = i;
      b.setAttribute('aria-label', 'card ' + (i + 1));
      b.addEventListener('click', function () { flip(b); });
      grid.appendChild(b);
    });
    first = null; lock = false; moves = 0; matched = 0; secs = 0; started = false;
    if (timer) { clearInterval(timer); timer = null; }
    movesEl.textContent = '0';
    timeEl.textContent = '0:00';
    winBox.hidden = true;
    paintBest();
  }
  function deal() {
    clearProgress();
    build(shuffle(FACES.concat(FACES)));
  }
  // Pick up where the last session left off; the clock resumes on the next flip.
  function resume(p) {
    build(p.deck);
    p.done.forEach(function (i) {
      var c = grid.children[i];
      if (!c) return;
      c.classList.add('open', 'done', 'restored');
      c.textContent = c.dataset.face;
      c.disabled = true;
    });
    matched = p.done.length;
    moves = p.moves || 0;
    secs = p.secs || 0;
    movesEl.textContent = String(moves);
    timeEl.textContent = fmt(secs);
  }
  function flip(card) {
    if (lock || card.classList.contains('open') || card.classList.contains('done')) return;
    if (!started) { started = true; timer = setInterval(tick, 1000); }
    card.classList.add('open');
    card.textContent = card.dataset.face;
    if (!first) { first = card; return; }
    moves++;
    movesEl.textContent = String(moves);
    if (first.dataset.face === card.dataset.face) {
      first.classList.add('done');
      card.classList.add('done');
      first.disabled = true;
      card.disabled = true;
      first = null;
      matched += 2;
      if (matched === deck.length) finish();
      else save();
    } else {
      save();
      lock = true;
      var a = first, b = card;
      first = null;
      setTimeout(function () {
        a.classList.remove('open'); a.textContent = '';
        b.classList.remove('open'); b.textContent = '';
        lock = false;
      }, 650);
    }
  }
  function finish() {
    if (timer) { clearInterval(timer); timer = null; }
    clearProgress();
    var b = best();
    var isBest = b === null || secs < b;
    if (isBest) {
      try { localStorage.setItem(BEST_KEY, String(secs)); } catch (e) {}
      paintBest();
    }
    winline.textContent = fmt(secs) + ' · ' + moves + ' moves' + (isBest ? ' · new best!' : '');
    winBox.hidden = false;
    celebrate(isBest ? 90 : 45);
  }
  // A burst of confetti in Hub's brand colours; more for a new best.
  function celebrate(n) {
    var colors = ['#8b6cff', '#ff9a3d', '#2fc08f', '#ff5c7a', '#ffd34d', '#33b6f0'];
    var box = document.createElement('div');
    box.className = 'confetti';
    for (var i = 0; i < n; i++) {
      var c = document.createElement('i');
      c.style.left = Math.random() * 100 + '%';
      c.style.background = colors[i % colors.length];
      c.style.setProperty('--x', (Math.random() * 160 - 80) + 'px');
      c.style.setProperty('--r', (Math.random() * 900 - 450) + 'deg');
      c.style.setProperty('--d', (1.6 + Math.random() * 1.4) + 's');
      c.style.setProperty('--delay', (Math.random() * 0.35) + 's');
      if (i % 3 === 0) { c.style.width = '6px'; c.style.height = '6px'; c.style.borderRadius = '50%'; }
      box.appendChild(c);
    }
    document.body.appendChild(box);
    setTimeout(function () { box.remove(); }, 3400);
  }
  document.getElementById('restart').addEventListener('click', deal);
  document.getElementById('again').addEventListener('click', deal);
  var p = saved();
  if (p && p.done.length > 0 && p.done.length < p.deck.length) resume(p);
  else deal();
})();
</script>
</body>
</html>
