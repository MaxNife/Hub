<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puzzle</title>
<script>
  // Follow Hub's theme choice (same origin, so its setting is readable).
  (function () {
    function apply() {
      try {
        var t = localStorage.getItem('hub:theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        else document.documentElement.removeAttribute('data-theme');
      } catch (e) {}
    }
    apply();
    window.addEventListener('storage', function (e) { if (e.key === 'hub:theme') apply(); });
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&display=swap">
<style>
  :root {
    color-scheme: light;
    --paper: #eee9df; --surface: #f8f5ef; --ink: #1c1a16; --muted: #625b4f; --line: #d9d1c2; --dash: #b8ae9c;
    --live: #1e7a48; --live-ink: #fff; --focus: #3552e0; --bad: #c0322f;
    --display: 'Bricolage Grotesque', system-ui, sans-serif;
    --body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; --paper: #17150f; --surface: #221f18; --ink: #f2ede3; --muted: #a69e8f; --line: #35302a; --dash: #5a5345; --live: #4cc784; --live-ink: #10140f; --focus: #8fa2ff; --bad: #f0706b; }
  }
  :root[data-theme="dark"] { color-scheme: dark; --paper: #17150f; --surface: #221f18; --ink: #f2ede3; --muted: #a69e8f; --line: #35302a; --dash: #5a5345; --live: #4cc784; --live-ink: #10140f; --focus: #8fa2ff; --bad: #f0706b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  h1 { margin: 0; font-family: var(--display); font-size: 40px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; }
  .sub { margin: 8px 0 24px; color: var(--muted); font-size: 15px; }
  .ink-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 22px; border: none; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: 15px; font-weight: 600; cursor: pointer; }
  .pill-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 14px; font-weight: 600; cursor: pointer; }
  .pill-btn:hover { border-color: var(--dash); }
  .seg { display: inline-flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); max-width: 100%; overflow-x: auto; }
  .seg button { height: 34px; padding: 0 14px; border: none; border-radius: 999px; background: transparent; color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .seg button.active, .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
<link rel="stylesheet" href="./app-kit.css">
<link rel="stylesheet" href="./game-kit.css">
<style>
  html, body { height: 100%; }
  body { padding: 16px; min-height: 100dvh; }
  .wrap { max-width: 480px; margin: 0 auto; }
  .top { display: flex; align-items: center; gap: 10px; }
  .top h1 { flex-grow: 1; font-size: 28px; }
  .level { font-family: var(--body); font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 6px; }
  button.restart { height: 36px; padding: 0 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 13px; font-weight: 600; cursor: pointer; }
  .stats { display: flex; gap: 8px; margin: 12px 0 16px; }
  .stat { flex: 1; padding: 6px 4px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); text-align: center; }
  .stat b { display: block; font-size: 17px; }
  .stat small { font-size: 11px; color: var(--muted); }
  .board { position: relative; display: grid; gap: 8px; aspect-ratio: 1; max-height: calc(100dvh - 200px); margin: 0 auto; }
  .board.n5 { gap: 6px; }
  .tile {
    display: flex; align-items: center; justify-content: center; border: none; border-radius: 14px;
    background: var(--surface); box-shadow: inset 0 0 0 1px var(--line);
    font-family: var(--display); font-size: clamp(20px, 7vmin, 40px); font-weight: 700; cursor: pointer;
    transition: transform .12s ease, background-color .2s;
  }
  .n5 .tile { border-radius: 11px; font-size: clamp(16px, 5.5vmin, 32px); }
  .tile:hover { transform: scale(0.97); }
  .tile.home { background: color-mix(in srgb, #43ddb9 22%, var(--surface)); box-shadow: inset 0 0 0 1px color-mix(in srgb, #0e8a74 45%, var(--line)); }
  .colours .tile { color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.35); box-shadow: none; background: var(--tint); }
  .colours .tile.home { background: var(--tint); box-shadow: inset 0 0 0 3px rgba(255,255,255,.75); }
  .tile.gap { visibility: hidden; }
  .tile.nope { animation: nope .25s ease; }
  @keyframes nope { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
  .win { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; border-radius: 18px; background: color-mix(in srgb, var(--paper) 94%, transparent); animation: pop .4s cubic-bezier(.34,1.56,.64,1) both; }
  .win h2 { margin: 0; font-family: var(--display); font-size: 36px; letter-spacing: -0.03em; }
  .win p { margin: 0 0 8px; color: var(--muted); }
  .win .actions { display: flex; gap: 10px; }
  @keyframes pop { from { opacity: 0; transform: scale(.94); } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top" id="top">
    <h1>Puzzle<span class="level" id="level"></span></h1>
    <button class="restart" id="shuffle" type="button">Shuffle</button>
  </div>
  <div class="stats">
    <div class="stat"><b id="moves">0</b><small>Moves</small></div>
    <div class="stat"><b id="time">0:00</b><small>Time</small></div>
    <div class="stat"><b id="best">–</b><small>Best</small></div>
  </div>
  <div class="board" id="board" role="grid" aria-label="Sliding puzzle. Use the arrow keys or tap a tile next to the gap.">
    <div class="win" id="win" hidden><h2>Solved!</h2><p id="winline"></p>
      <div class="actions"><button class="pill-btn" id="tomenu" type="button">Menu</button><button class="ink-btn" id="again" type="button">Shuffle again</button></div>
    </div>
  </div>
</div>
<script src="./app-kit.js"></script>
<script src="./game-kit.js"></script>
<script>
(function () {
  'use strict';
  var SAVE_KEY = 'puzzle:save', SOLVED_KEY = 'puzzle:solved';
  var board = document.getElementById('board'), win = document.getElementById('win');
  var n = 4, tiles = [], moves = 0, secs = 0, timer = null;

  function bestKey(size) { return 'puzzle:best:' + size; }
  function best(size) { try { var v = JSON.parse(localStorage.getItem(bestKey(size || n)) || 'null'); return v && v.moves ? v : null; } catch (e) { return null; } }
  function num(key) { try { var v = parseInt(localStorage.getItem(key) || '', 10); return isFinite(v) ? v : null; } catch (e) { return null; } }
  function fmt(s) { return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  function stopClock() { if (timer) { clearInterval(timer); timer = null; } }
  function paintStats() {
    document.getElementById('moves').textContent = moves;
    document.getElementById('time').textContent = fmt(secs);
    var b = best();
    document.getElementById('best').textContent = b ? b.moves + ' · ' + fmt(b.secs) : '–';
  }
  function save() {
    try {
      if (moves > 0 && !solved()) localStorage.setItem(SAVE_KEY, JSON.stringify({ n: n, tiles: tiles, moves: moves, secs: secs }));
      else localStorage.removeItem(SAVE_KEY);
    } catch (e) {}
  }
  function saved() {
    try {
      var p = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
      if (p && [3, 4, 5].indexOf(p.n) >= 0 && Array.isArray(p.tiles) && p.tiles.length === p.n * p.n && p.tiles.indexOf(0) >= 0) return p;
    } catch (e) {}
    return null;
  }
  function neighbours(i) {
    var r = Math.floor(i / n), c = i % n, out = [];
    if (r > 0) out.push(i - n);
    if (r < n - 1) out.push(i + n);
    if (c > 0) out.push(i - 1);
    if (c < n - 1) out.push(i + 1);
    return out;
  }
  // Shuffle with random legal moves, so every board is solvable.
  function shuffle(size) {
    n = size || n;
    tiles = [];
    for (var i = 1; i < n * n; i++) tiles.push(i);
    tiles.push(0);
    var gap = n * n - 1, prev = -1;
    for (var k = 0; k < n * n * 40; k++) {
      var opts = neighbours(gap).filter(function (x) { return x !== prev; });
      var pick = opts[Math.floor(Math.random() * opts.length)];
      tiles[gap] = tiles[pick]; tiles[pick] = 0; prev = gap; gap = pick;
    }
    if (solved()) return shuffle(n);
    moves = 0; secs = 0;
    stopClock();
    save();
    win.hidden = true;
    render();
  }
  function solved() {
    for (var i = 0; i < n * n - 1; i++) if (tiles[i] !== i + 1) return false;
    return true;
  }
  // Colours mode: each tile is tinted by where it belongs, so rows read as bands.
  function tint(v) {
    var r = Math.floor((v - 1) / n), c = (v - 1) % n;
    return 'hsl(' + Math.round(205 - (r / Math.max(1, n - 1)) * 195) + ' 46% ' + (52 - (c / Math.max(1, n - 1)) * 16) + '%)';
  }
  function render() {
    board.style.gridTemplateColumns = 'repeat(' + n + ', 1fr)';
    board.classList.toggle('n5', n === 5);
    board.classList.toggle('colours', kit.settings.style === 'colours');
    document.getElementById('level').textContent = n + ' × ' + n;
    Array.prototype.slice.call(board.querySelectorAll('.tile')).forEach(function (t) { t.remove(); });
    tiles.forEach(function (v, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tile' + (v === 0 ? ' gap' : v === i + 1 ? ' home' : '');
      b.textContent = v || '';
      if (v) b.style.setProperty('--tint', tint(v));
      b.setAttribute('aria-label', v ? 'Tile ' + v : 'Gap');
      b.addEventListener('click', function () { move(i, b); });
      board.insertBefore(b, win);
    });
    paintStats();
  }
  function move(i, el) {
    if (!win.hidden || !kit.playing) return;
    var gap = tiles.indexOf(0);
    if (neighbours(gap).indexOf(i) < 0) {
      if (el && i !== gap) { kit.sfx('bad'); el.classList.remove('nope'); void el.offsetWidth; el.classList.add('nope'); }
      return;
    }
    if (!timer) timer = setInterval(function () { secs++; paintStats(); }, 1000);
    tiles[gap] = tiles[i]; tiles[i] = 0; moves++;
    kit.sfx('move');
    render();
    if (solved()) finish();
    else save();
  }
  function finish() {
    stopClock();
    save();
    kit.sfx('win');
    kit.played();
    try { localStorage.setItem(SOLVED_KEY, String((num(SOLVED_KEY) || 0) + 1)); } catch (e) {}
    var b = best(), isBest = !b || moves < b.moves || (moves === b.moves && secs < b.secs);
    if (isBest) { try { localStorage.setItem(bestKey(n), JSON.stringify({ moves: moves, secs: secs })); } catch (e) {} }
    document.getElementById('winline').textContent = moves + ' moves · ' + fmt(secs) + (isBest ? ' · new best!' : '');
    win.hidden = false;
    paintStats();
  }

  var kit = GameKit.create({
    id: 'puzzle',
    title: 'Puzzle',
    tagline: 'Slide the tiles back into order.',
    art: '<svg viewBox="0 0 64 64"><defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#43DDB9"/><stop offset="1" stop-color="#0E8A74"/></linearGradient></defs>' +
      '<rect width="64" height="64" rx="16" fill="url(#pg)"/><rect x="12" y="12" width="18" height="18" rx="5" fill="#fff"/><rect x="34" y="12" width="18" height="18" rx="5" fill="#FFD34D"/>' +
      '<rect x="12" y="34" width="18" height="18" rx="5" fill="#FF5C8A"/><rect x="34" y="34" width="18" height="18" rx="5" fill="#15395E"/></svg>',
    howTo: [
      'Tap a tile next to the gap to slide it in, or use the arrow keys.',
      'Put the tiles in order, left to right and top to bottom, with the gap last.',
      'Tiles in the right place light up. Fewest moves wins, then fastest time.',
      'Try Colours in Settings: tiles are tinted by the row they belong in.',
    ],
    difficulties: [
      { id: '3', label: '3 × 3', detail: 'Warm-up' },
      { id: '4', label: '4 × 4', detail: 'Classic' },
      { id: '5', label: '5 × 5', detail: 'Marathon' },
    ],
    defaultDifficulty: '4',
    options: [{ key: 'style', label: 'Tiles', def: 'numbers', choices: [['numbers', 'Numbers'], ['colours', 'Colours']] }],
    stats: function (k) {
      var b = best(+k.settings.difficulty);
      return [
        { label: 'Best · ' + k.settings.difficulty + ' × ' + k.settings.difficulty, value: b ? b.moves + ' moves' : '–' },
        { label: 'Best time', value: b ? fmt(b.secs) : '–' },
        { label: 'Puzzles solved', value: num(SOLVED_KEY) || 0 },
      ];
    },
    saved: function () {
      var p = saved();
      return p && { label: p.n + ' × ' + p.n + ' · ' + p.moves + ' moves · ' + fmt(p.secs || 0) };
    },
    onNew: function (s) { shuffle(+s.difficulty || 4); },
    onContinue: function (s) {
      var p = saved();
      if (!p) return shuffle(+s.difficulty || 4);
      n = p.n; tiles = p.tiles; moves = p.moves || 0; secs = p.secs || 0;
      stopClock();
      win.hidden = true;
      render();
    },
    onPause: function () { stopClock(); save(); },
    onResetStats: function () {
      [3, 4, 5].forEach(function (s) { try { localStorage.removeItem(bestKey(s)); } catch (e) {} });
      try { localStorage.removeItem(SOLVED_KEY); } catch (e) {}
      paintStats();
    },
  });
  document.getElementById('top').prepend(kit.menuButton());
  document.addEventListener('keydown', function (e) {
    if (!kit.playing || !tiles.length) return;
    var gap = tiles.indexOf(0), r = Math.floor(gap / n), c = gap % n, t = -1;
    if (e.key === 'ArrowUp' && r < n - 1) t = gap + n;      // tile below slides up
    if (e.key === 'ArrowDown' && r > 0) t = gap - n;
    if (e.key === 'ArrowLeft' && c < n - 1) t = gap + 1;
    if (e.key === 'ArrowRight' && c > 0) t = gap - 1;
    if (t >= 0) { e.preventDefault(); move(t); }
  });
  document.getElementById('shuffle').addEventListener('click', function () { kit.sfx('tap'); shuffle(); });
  document.getElementById('again').addEventListener('click', function () { shuffle(); });
  document.getElementById('tomenu').addEventListener('click', function () { kit.showHome(); });
})();
</script>
</body>
</html>
